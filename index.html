<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dennis">
<meta name="theme-color" content="#e8eaed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Dennis</title>
<style>
:root{
  --ground:#e8eaed; --paper:#ffffff; --raised:#f5f6f7; --ink:#14161a; --sub:#5e636b; --faint:#9399a1; --line:#d5d8dd;
  --cobalt:#2343e8; --cobalt-ink:#1a33b8; --cobalt-wash:#e3e8fd; --signal:#f2d200;
  --ok:#1e9e5a; --warn:#e3a008; --bad:#e0352b; --ok-wash:#dff3e8; --warn-wash:#fbf0d0; --bad-wash:#fbe1df;
  --bib-ink:#14161a;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --text:"Instrument Sans",-apple-system,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root{
  --ground:#0f1114; --paper:#1a1d22; --raised:#22262c; --ink:#eef0f2; --sub:#9aa0a8; --faint:#6b717a; --line:#2a2e35;
  --cobalt:#6680ff; --cobalt-ink:#9aabff; --cobalt-wash:#1c2448;
  --ok:#3dc47b; --warn:#f0b429; --bad:#ff5a4f; --ok-wash:#15301f; --warn-wash:#33290f; --bad-wash:#3a1715;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
#app{padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 118px);max-width:480px;margin:0 auto}
.num,.d{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.sub{color:var(--sub)}.faint{color:var(--faint)}.s{font-size:14px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1}
.sec-h .s{color:var(--sub)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 18px}
.page-h h1{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;margin:0;letter-spacing:-.005em}
.page-h .s{color:var(--sub);margin-top:6px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub);background:var(--paper)}
.ibtn svg{width:20px;height:20px}

/* ---------- Startnummer ---------- */
.bib{position:relative;background:#fff;color:var(--bib-ink);border-radius:5px;padding:0 0 18px;overflow:hidden;
  box-shadow:0 1px 0 rgba(20,22,26,.06),0 18px 40px -22px rgba(20,22,26,.35);transform-origin:50% 0}
.bib::before,.bib::after,.bib i.h1,.bib i.h2{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--ground);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25);top:54px}
.bib::before{left:13px}.bib::after{right:13px}
.bib i.h1,.bib i.h2{top:auto;bottom:13px}.bib i.h1{left:13px}.bib i.h2{right:13px}
.bib .strip{background:var(--cobalt);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:9px 16px;font-weight:600;font-size:14px}
.bib .strip b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em}
.bib .no{font-family:var(--display);font-weight:900;font-size:clamp(118px,38vw,168px);line-height:.82;text-align:center;margin:22px 0 4px;letter-spacing:-.01em}
.bib .cap{text-align:center;font-weight:600;font-size:15px}
.bib .motto{text-align:center;font-size:13.5px;color:#5e636b;margin:10px 34px 0}
.bib .chip{position:absolute;right:16px;bottom:14px;width:30px;height:16px;border-radius:3px;background:var(--signal);opacity:.9}
@media (prefers-reduced-motion:no-preference){.bib.enter{animation:pin .7s var(--ease) both}}
@keyframes pin{from{transform:rotate(-2.5deg) translateY(-14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Ampel-Band ---------- */
.signal{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--paper)}
.signal .lamp{width:16px;height:16px;border-radius:50%;grid-row:span 2;align-self:start;margin-top:4px;box-shadow:0 0 0 5px var(--glow)}
.signal.gruen{--glow:var(--ok-wash)}.signal.gruen .lamp{background:var(--ok)}
.signal.gelb{--glow:var(--warn-wash)}.signal.gelb .lamp{background:var(--warn)}
.signal.rot{--glow:var(--bad-wash)}.signal.rot .lamp{background:var(--bad)}
.signal.grau{--glow:var(--line)}.signal.grau .lamp{background:var(--faint)}
.signal b{font-weight:700}
.signal .coach{grid-column:2;margin-top:8px;padding-top:10px;border-top:1px solid var(--line);white-space:pre-line;font-size:15px}

/* ---------- Ticket ---------- */
.ticket{display:grid;grid-template-columns:88px 1fr;background:var(--paper);border-radius:14px;position:relative;min-height:128px}
.ticket .stub{padding:16px 0 16px 16px;border-right:2px dashed var(--line);display:flex;flex-direction:column;justify-content:space-between}
.ticket::before,.ticket::after{content:"";position:absolute;left:79px;width:18px;height:18px;border-radius:50%;background:var(--ground)}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .t{font-family:var(--display);font-weight:800;font-size:30px;line-height:.95}
.ticket .t small{display:block;font-size:17px;color:var(--sub);font-weight:700}
.ticket .km{font-family:var(--display);font-weight:800;font-size:22px;color:var(--cobalt)}
.ticket .main{padding:16px 16px 16px 18px;display:flex;flex-direction:column;gap:6px}
.ticket .k{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:13.5px;font-weight:600}
.ticket .k svg{width:16px;height:16px}
.ticket h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.ticket p{margin:0;font-size:14.5px;color:var(--sub)}
.ticket .note{color:var(--cobalt-ink);font-size:13.5px;font-weight:600}
.ticket .act{margin-top:auto;padding-top:8px}
.donebtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;transition:transform .15s var(--ease)}
.donebtn:active{transform:scale(.96)}
.donebtn svg{width:18px;height:18px}
.ticket.done{background:var(--ok-wash)}
.ticket.done .donebtn{background:var(--ok);color:#fff}
.ticket .stamp{position:absolute;right:14px;top:12px;font-family:var(--display);font-weight:900;font-size:22px;color:var(--ok);border:2.5px solid var(--ok);border-radius:6px;padding:0 7px;transform:rotate(-8deg);opacity:.9}
@media (prefers-reduced-motion:no-preference){.stamp.pop{animation:stamp .45s var(--ease) both}}
@keyframes stamp{0%{transform:rotate(-8deg) scale(1.9);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:.9}}
.rest{background:var(--paper);border-radius:14px;padding:16px}
.rest h3{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:26px}

/* ---------- Wochenleiste ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .w{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:12px}
.week .w.today{background:var(--paper)}
.week .w .dn{font-size:12px;color:var(--sub);font-weight:600}
.week .w .dd{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.week .w .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--sub)}
.week .w .mk svg{width:15px;height:15px}
.week .w .mk.run{border-color:var(--cobalt);color:var(--cobalt)}
.week .w .mk.hard{border-color:var(--cobalt);background:var(--cobalt-wash);color:var(--cobalt)}
.week .w .mk.kraft{border-color:var(--ink);color:var(--ink)}
.week .w .mk.off{border-style:dotted}
.week .w .mk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.week .w .mk.race{background:var(--signal);border-color:var(--signal);color:#14161a}

/* ---------- Tankanzeige ---------- */
.fuel .big{font-family:var(--display);font-weight:900;font-size:58px;line-height:.85}
.fuel .big small{font-size:22px;font-weight:700;color:var(--sub);margin-left:6px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 8px}
.segs i{height:22px;border-radius:3px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.segs i.f{background:var(--ink);box-shadow:none}
.segs i.p{background:linear-gradient(90deg,var(--ink) var(--pp),var(--paper) var(--pp));box-shadow:inset 0 0 0 1px var(--line)}
.segs.over i.f{background:var(--bad)}
.protein{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--sub)}
.protein .pb{flex:1;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.protein .pb i{display:block;height:100%;background:var(--cobalt);border-radius:9px}

/* ---------- Lineal ---------- */
.ruler{position:relative;height:74px;margin:6px 4px 0}
.ruler svg{width:100%;height:100%;overflow:visible}
.ruler text{font-family:var(--display);font-weight:700;font-size:13px;fill:var(--sub)}
.ruler .tk{stroke:var(--faint)}.ruler .tk.m{stroke:var(--ink)}
.ruler .ms{fill:var(--cobalt)}
.wt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wt .big{font-family:var(--display);font-weight:900;font-size:46px;line-height:.9}
.wt .big small{font-size:20px;color:var(--sub);font-weight:700}

/* ---------- Serien ---------- */
.streaks{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:14px}
.streaks div{padding:14px 12px;text-align:left}
.streaks div+div{border-left:1px solid var(--line)}
.streaks b{display:block;font-family:var(--display);font-weight:900;font-size:36px;line-height:.9}
.streaks span{font-size:12.5px;color:var(--sub)}

/* ---------- Allgemein ---------- */
.panel{background:var(--paper);border-radius:14px;padding:16px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0;padding-top:2px}
.list .it:last-child{padding-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cobalt);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.plain{background:transparent;color:var(--sub);padding:8px}
.btn.block{width:100%;padding:15px;font-size:17px}
.btn.small{padding:7px 12px;font-size:14px}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;min-width:118px;max-width:170px;transition:transform .12s var(--ease)}
.chip:active{transform:scale(.95)}
.chip .n{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.chip .v{font-family:var(--display);font-weight:800;font-size:22px;margin-top:4px}
.chip .v small{font-size:13px;color:var(--sub);font-weight:700}
.chip.beer .v{color:var(--warn)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:var(--paper);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px}
.tool svg{width:24px;height:24px;color:var(--cobalt)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 16px}
.daynav b{font-family:var(--display);font-weight:800;font-size:20px}
.meal{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:19px;margin:18px 2px 6px}
.meal span{font-size:16px;color:var(--sub)}
.x{color:var(--faint);padding:4px}
.x svg{width:16px;height:16px}
input[type=text],input[type=email],input[type=password],input[type=search],select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);outline:none;font-size:16px}
input:focus,select:focus{border-color:var(--cobalt)}
label.f{display:block;font-size:13.5px;color:var(--sub);font-weight:600;margin:12px 2px 6px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--cobalt)}

/* Phase-Leiste */
.phases{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;margin:10px 0 6px}
.phases i{height:12px;border-radius:2px;background:var(--line)}
.phases i.Reset{background:#b8c2d6}.phases i.Grundlage{background:#7f93c9}.phases i.Aufbau{background:#4a63d6}.phases i.Spezifisch{background:var(--cobalt)}.phases i.Taper{background:var(--signal)}
.phases i.now{outline:2px solid var(--ink);outline-offset:1px}
.phlab{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;font-size:12px;color:var(--sub)}
.phlab span{white-space:nowrap;overflow:hidden;text-overflow:clip}

/* Trainingsliste */
.days .dy{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.days .dy:first-child{border-top:0;padding-top:4px}
.days .dy .dt{line-height:1}
.days .dy .dt .a{font-size:12.5px;color:var(--sub);font-weight:600}
.days .dy .dt .b{font-family:var(--display);font-weight:900;font-size:30px}
.days .dy.today .dt .b{color:var(--cobalt)}
.days .dy h4{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05}
.days .dy .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:13px;color:var(--sub)}
.days .dy .slot{font-weight:700;color:var(--cobalt-ink)}
.days .dy .ev{font-size:13px;color:var(--sub);margin-top:6px;display:flex;gap:6px;align-items:center}
.days .dy .ev svg{width:13px;height:13px;flex:none}
.days .dy .done-a{font-size:13px;color:var(--ok);margin-top:6px;font-weight:600}
.days .dy .off h4{color:var(--faint)}
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.ck svg{width:17px;height:17px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* Körper */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.kpis div{background:var(--paper);padding:12px}
.kpis b{display:block;font-family:var(--display);font-weight:900;font-size:28px;line-height:1}
.kpis span{font-size:12px;color:var(--sub)}
.ms-list .it b{font-family:var(--display);font-weight:800;font-size:19px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--sub)}
.tag.ok{background:var(--ok-wash);color:var(--ok)}.tag.bad{background:var(--bad-wash);color:var(--bad)}
.spark{margin-top:4px}
.spark svg{width:100%;height:64px;display:block}
.sp-h{display:flex;justify-content:space-between;align-items:baseline}
.sp-h b{font-family:var(--display);font-weight:900;font-size:26px}
.wform{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.wform .btn{grid-column:span 2}

/* ---------- Dock ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
  display:flex;align-items:center;gap:2px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px -12px rgba(0,0,0,.35),0 0 0 1px var(--line)}
.dock button{width:58px;height:50px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--ink)}
.dock button.on svg{color:var(--cobalt)}
.dock .plus{width:54px;height:54px;border-radius:50%;background:var(--cobalt);color:#fff;margin:0 6px;box-shadow:0 8px 18px -8px var(--cobalt)}
.dock .plus svg{width:26px;height:26px}
.dock .plus:active{transform:scale(.94)}

/* ---------- Sheets ---------- */
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--ground);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.sheet .in::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:fade .2s ease both}.sheet .in{animation:up .32s var(--ease) both}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h1{font-family:var(--display);font-weight:900;font-size:32px;margin:0;line-height:1}
.sheet .row h1{flex:1}
.sheet .list{background:var(--paper);border-radius:14px;padding:6px 14px;margin-top:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quick button{background:var(--paper);border-radius:16px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700}
.quick button svg{width:26px;height:26px;color:var(--cobalt)}
.quick button span{font-weight:500;font-size:13px;color:var(--sub)}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:99px;font-size:14.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.lnk{color:var(--sub);text-decoration:none;font-size:14px;font-weight:600}
.foot{display:flex;justify-content:center;gap:18px;margin-top:30px}
.small{font-size:13.5px}.muted{color:var(--sub)}.card{background:var(--paper);border-radius:14px;padding:16px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>
<div id="app"></div>
<nav class="dock" id="tabs" hidden>
  <button data-t="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-t="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1.5-3 4-3 8h3"/></svg>Essen</button>
  <button class="plus" id="plus" aria-label="Schnell eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0M7 21l3-6 3 2v4M6 12l2-3 4-1 3 3 3 1M10 15l1-4"/></svg>Training</button>

const iso = (d) => d.toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });

// ---------- Daten ----------

async function q(p) { const { data, error } = await p; if (error) { console.error(error); toast("Fehler: " + error.message); throw error; } return data; }

async function loadAll() {

}

}

const planOn = (d) => S.plan.find((p) => p.date === d);
const foodsOn = (d) => S.foods.filter((f) => f.day === d);
const eventsOn = (d) => S.events.filter((e) => {

  return iso(new Date(e.starts_at)) === d;
});
const actsOn = (d) => S.acts.filter((a) => a.date === d);
const RUN_TYPES = ["Laufen", "Running", "Trail Running", "Treadmill Running", "Laufband"];

function weightAvg(endIso, days = 7) {
  const from = addDays(endIso, -days + 1);
  const v = S.weights.filter((w) => w.kg && w.date >= from && w.date <= endIso).map((w) => +w.kg);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function latestWeight() { const w = [...S.weights].reverse().find((x) => x.kg); return w ? +w.kg : null; }
function latestWaist() { const w = [...S.weights].reverse().find((x) => x.waist_cm); return w ? +w.waist_cm : null; }
function nextMilestone() { const t = today(); return MILESTONES.find(([d]) => d >= t) || MILESTONES.at(-1); }

function ampel() {
  if (S.coach && S.coach.date >= addDays(today(), -1) && S.coach.ampel) return { c: S.coach.ampel, why: S.coach.headline || "" };
  const rows = S.daily.filter((r) => r.hrv_night != null || r.rhr != null);
  const last = rows.at(-1); if (!last) return { c: "grau", why: "Noch keine Garmin-Daten" };
  const prev = rows.at(-2) || {};
  const below = (r) => r.hrv_night != null && r.hrv_base_low != null && r.hrv_night < r.hrv_base_low;
  let c = "gruen", why = [];
  if (below(last)) { c = "gelb"; why.push(`HRV ${last.hrv_night} unter Band ${last.hrv_base_low}–${last.hrv_base_high}`); }
  else if (last.hrv_night != null) why.push(`HRV ${last.hrv_night} im Band`);
  if (last.rhr >= 59) { c = c === "gruen" ? "gelb" : c; why.push(`Ruhepuls ${last.rhr}`); }
  if (last.sleep_h != null && last.sleep_h < 6) { c = c === "gruen" ? "gelb" : c; why.push(`nur ${fmt(last.sleep_h, 1)} h Schlaf`); }
  if ((below(last) && below(prev)) || last.rhr >= 65) c = "rot";
  return { c, why: why.join(" · ") };
}
const AMPEL_TXT = { gruen: "Grün – Plan wie geplant", gelb: "Gelb – heute locker statt hart", rot: "Rot – Pause oder Spaziergang", grau: "Noch keine Daten" };

function streakPlan() {
  let n = 0;
  for (let d = addDays(today(), -1); d >= "2026-11-06"; d = addDays(d, -1)) {
    const p = planOn(d); if (!p || ["rest", "free"].includes(p.kind)) continue;
    if (p.done) n++; else break;
  }
  const t = planOn(today()); if (t && t.done && !["rest", "free"].includes(t.kind)) n++;
  return n;
}
function streakLogging() {
  let n = 0;
  for (let d = addDays(today(), foodsOn(today()).length ? 0 : -1); n < 60; d = addDays(d, -1)) { if (foodsOn(d).length) n++; else break; }
  return n;
}
function beerFreeDays() {
  const days = S.foods.map((f) => f.day).sort();
  if (!days.length) return null;
  const beers = S.foods.filter((f) => f.is_beer).map((f) => f.day).sort();
  return beers.length ? daysBetween(beers.at(-1), today()) : daysBetween(days[0], today()) + 1;
}

function ticket(p) {
  if (!p) return `<div class="rest"><h3>Kein Plan für heute</h3><p class="sub s" style="margin:0">Der Plan startet am 6. November.</p></div>`;

}

function weekStrip(ws) {

}

function fuel(eaten, target, prot) {
  const per = target / 10, segs = [...Array(10)].map((_, i) => {
    const lo = i * per, hi = lo + per;
    if (eaten >= hi) return `<i class="f"></i>`;
    if (eaten > lo) return `<i class="p" style="--pp:${Math.round((eaten - lo) / per * 100)}%"></i>`;
    return `<i></i>`; }).join("");
  const left = target - eaten;
  return `<div class="fuel">
    <div class="big">${fmt(Math.abs(left))}<small>${left >= 0 ? "kcal übrig" : "kcal drüber"}</small></div>
    <div class="segs ${left < 0 ? "over" : ""}" aria-label="${fmt(eaten)} von ${fmt(target)} kcal">${segs}</div>
    <div class="row xs sub" style="justify-content:space-between"><span>${fmt(eaten)} gegessen</span><span>Budget ${fmt(target)}</span></div>
    <div class="protein" style="margin-top:12px"><span>Protein</span><div class="pb"><i style="width:${Math.min(100, prot / PROTEIN_GOAL * 100)}%"></i></div><span class="num" style="font-size:16px;font-weight:700;color:var(--ink)">${fmt(prot)}<span class="sub" style="font-size:13px"> / ${PROTEIN_GOAL} g</span></span></div>
  </div>`;
}

function ruler(cur) {
  const W = 340, H = 74, x0 = 12, x1 = W - 12, hi = START.kg, lo = GOAL_KG;
  const x = (v) => x0 + (hi - v) / (hi - lo) * (x1 - x0);
  let ticks = "";
  for (let v = hi * 2; v >= lo * 2; v--) { const kg = v / 2, major = kg % 1 === 0;
    ticks += `<line class="tk ${major ? "m" : ""}" x1="${x(kg)}" x2="${x(kg)}" y1="${major ? 30 : 38}" y2="52" stroke-width="${major ? 1.6 : 1}"/>`;
    if (major) ticks += `<text x="${x(kg)}" y="70" text-anchor="middle">${kg}</text>`; }
  const ms = MILESTONES.filter(([, kg]) => kg >= lo).map(([d, kg]) => `<rect class="ms" x="${x(kg) - 1.5}" y="22" width="3" height="10" rx="1.5"><title>${dShort(d)}: ${fmt(kg, 1)} kg</title></rect>`).join("");
  const c = Math.max(lo, Math.min(hi, cur));
  return `<div class="ruler"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewicht ${fmt(cur, 1)} kg auf dem Weg von ${hi} zu ${lo} kg">
    <rect x="${x0}" y="51" width="${x(c) - x0}" height="3" rx="1.5" fill="var(--cobalt)"/>${ticks}${ms}
    <path d="M${x(c) - 9} 4 h18 l-9 13 z" fill="var(--ink)"/><line x1="${x(c)}" x2="${x(c)}" y1="16" y2="54" stroke="var(--ink)" stroke-width="2.5"/></svg></div>`;
}

function vHeute() {

function spark(rows, key, color, band) {
  const W = 320, H = 64, pts = rows.map((r, i) => [i, r[key]]).filter(([, v]) => v != null);
  if (pts.length < 2) return `<div class="xs sub">Zu wenig Daten</div>`;
  const vs = pts.map(([, v]) => v).concat(band ? rows.flatMap((r) => [r[band[0]], r[band[1]]]).filter((v) => v != null) : []);
  const lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1, n = rows.length - 1 || 1;
  const x = (i) => 4 + i / n * (W - 8), y = (v) => 5 + (hi - v) / (hi - lo) * (H - 10);
  let b = "";
  if (band) { const top = rows.map((r, i) => r[band[1]] != null ? `${x(i)},${y(r[band[1]])}` : null).filter(Boolean), bot = rows.map((r, i) => r[band[0]] != null ? `${x(i)},${y(r[band[0]])}` : null).filter(Boolean).reverse();
    if (top.length > 1) b = `<polygon points="${top.concat(bot).join(" ")}" fill="var(--line)" opacity=".8"/>`; }
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${b}<polyline points="${pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(pts.at(-1)[0])}" cy="${y(pts.at(-1)[1])}" r="3.5" fill="${color}"/></svg></div>`;
}

function weightChart() {
  const W = 340, H = 170, pad = { l: 30, r: 8, t: 10, b: 22 };
  const pts = S.weights.filter((w) => w.kg).map((w) => ({ d: w.date, v: +w.kg }));
  const path = [[START.date, START.kg], ...MILESTONES];
  const end = pts.length && pts.at(-1).d > addDays(today(), 42) ? pts.at(-1).d : addDays(today(), 42);
  const goalAt = (d) => { for (let i = 1; i < path.length; i++) { const [d0, v0] = path[i - 1], [d1, v1] = path[i]; if (d <= d1) return v0 + (v1 - v0) * daysBetween(d0, d) / daysBetween(d0, d1); } return path.at(-1)[1]; };
  const gp = path.filter(([d]) => d < end).concat([[end, goalAt(end)]]);
  const x0 = pts.length && pts[0].d < START.date ? pts[0].d : START.date, span = Math.max(30, daysBetween(x0, end));
  const vals = [...pts.map((p) => p.v), ...gp.map(([, v]) => v), START.kg];
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const x = (d) => pad.l + daysBetween(x0, d) / span * (W - pad.l - pad.r);
  const y = (v) => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const ticks = []; for (let v = hi; v >= lo; v -= Math.max(1, Math.round((hi - lo) / 4))) ticks.push(v);
  const avgLine = pts.map((p) => [p.d, weightAvg(p.d)]).filter(([, v]) => v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gewichtsverlauf">
    ${ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--sub)" font-family="var(--display)" font-weight="700">${v}</text>`).join("")}
    <polyline points="${gp.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--faint)" stroke-dasharray="4 5" stroke-width="1.5"/>
    ${avgLine.length > 1 ? `<polyline points="${avgLine.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--cobalt)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${pts.map((p) => `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3" fill="var(--cobalt)" opacity=".35"/>`).join("")}
    <text x="${pad.l}" y="${H - 5}" font-size="12" fill="var(--sub)">${dShort(x0)}</text><text x="${W - pad.r}" y="${H - 5}" text-anchor="end" font-size="12" fill="var(--sub)">${dShort(end)}</text>
  </svg>`;
}

function countUp() {
  const el = $("#bibno"); if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const to = +el.dataset.to, from = Math.min(to + 60, 400), t0 = performance.now(), dur = 900;
  const step = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from - (from - to) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ---------- Interaktion ----------
function bind() {
  $$("[data-go]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); go(el.dataset.go); });
  $$("[data-done]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); toggleDone(el.dataset.done); });
  const r = $("#reload"); if (r) r.onclick = async () => { await loadAll(); render(); toast("Aktualisiert"); };
  const lo = $("#logout"); if (lo) lo.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $$("[data-day]").forEach((el) => el.onclick = () => { const n = addDays(S.essenDay, +el.dataset.day); if (n <= today()) { S.essenDay = n; render(); } });
  $$("[data-week]").forEach((el) => el.onclick = () => { S.weekStart = addDays(S.weekStart, 7 * el.dataset.week); render(); });
  $$("[data-fav]").forEach((el) => el.onclick = () => addFav(el.dataset.fav));
  $$("[data-delfood]").forEach((el) => el.onclick = () => delFood(el.dataset.delfood));
  $$("[data-delw]").forEach((el) => el.onclick = () => delWeight(el.dataset.delw));
  const m = $("#manual"); if (m) m.onclick = () => foodSheet({});
  const sc = $("#scan"); if (sc) sc.onclick = scanSheet;
  const se = $("#search"); if (se) se.onclick = searchSheet;
  const ef = $("#editfavs"); if (ef) ef.onclick = favSheet;
  const ws = $("#wsave"); if (ws) ws.onclick = saveWeight;
  const cc = $("#copycal"); if (cc) cc.onclick = async () => { try { await navigator.clipboard.writeText(CFG.planCalendarUrl); toast("Adresse kopiert"); } catch { $("#calurl").select(); toast("Adresse markiert, jetzt kopieren"); } };
}
function go(t) { S.tab = t; if (t === "essen") S.essenDay = today(); render(); }

async function toggleDone(d) {
  const p = planOn(d); if (!p) return;
  const done = !p.done;
  await q(sb.from("plan").update({ done, done_at: done ? new Date().toISOString() : null }).eq("date", d));
  p.done = done; S._stamp = done ? d : null; render(); if (done) toast(["Stark gemacht", "Erledigt", "Läuft bei dir", "Abgehakt"][Math.floor(Math.random() * 4)]);
}

async function insertFood(f) {
  const row = await q(sb.from("foods").insert({ day: S.essenDay, ...f }).select().single());
  S.foods.push(row); render(); toast(`+${row.kcal} kcal`);
}
async function addFav(id) {
  const f = S.favs.find((x) => x.id === id); if (!f) return;
  await insertFood({ name: f.name, kcal: f.kcal, protein: f.protein, meal: f.meal || guessMeal(), is_beer: f.is_beer });
}
async function delFood(id) { await q(sb.from("foods").delete().eq("id", id)); S.foods = S.foods.filter((f) => f.id !== id); render(); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Frühstück" : h < 15 ? "Mittag" : h < 18 ? "Snack" : "Abend"; }

async function saveWeight() {
  const kg = parseFloat(($("#wkg").value || "").replace(",", ".")), waist = parseFloat(($("#wwaist").value || "").replace(",", "."));
  if (!kg && !waist) return toast("Gewicht oder Bauchumfang eintragen");
  if (kg && (kg < 50 || kg > 200)) return toast("Das Gewicht wirkt unrealistisch");
  const row = { date: today(), kg: kg || null, waist_cm: waist || null, source: "app", updated_at: new Date().toISOString() };
  await q(sb.from("weights").upsert(row, { onConflict: "date" }));
  S.weights = S.weights.filter((w) => w.date !== row.date).concat(row).sort((a, b) => a.date < b.date ? -1 : 1);
  render(); toast("Gewicht gespeichert");
}
async function delWeight(d) { await q(sb.from("weights").delete().eq("date", d)); S.weights = S.weights.filter((w) => w.date !== d); render(); }

// ---------- Sheets ----------
function sheet(html, onOpen) {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="in">${html}</div>`;
  el.onclick = (e) => { if (e.target === el) close(); };
  const close = () => { el.remove(); if (el._cleanup) el._cleanup(); };
  el.close = close; document.body.append(el);
  $$("[data-close]", el).forEach((b) => b.onclick = close);
  if (onOpen) onOpen(el);
  return el;
}

function foodSheet(pre) {
  const per100 = pre.per100;
  sheet(`<div class="row"><h1 class="grow">${per100 ? "Produkt" : "Eigenes Essen"}</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <label class="f">Name</label><input type="text" id="fn" value="${esc(pre.name || "")}">
    ${per100 ? `<div class="small muted" style="margin-top:6px">${fmt(per100.kcal)} kcal und ${fmt(per100.protein, 1)} g Protein pro 100 g</div>
      <label class="f">Menge (g)</label><input type="text" inputmode="decimal" id="fg" value="${pre.grams || 100}">` : ""}
    <div class="row" style="gap:8px"><div class="grow"><label class="f">kcal</label><input type="text" inputmode="numeric" id="fk" value="${pre.kcal ?? ""}"></div>
      <div class="grow"><label class="f">Protein (g)</label><input type="text" inputmode="decimal" id="fp" value="${pre.protein ?? ""}"></div></div>
    <label class="f">Mahlzeit</label><select id="fm">${MEALS.map((m) => `<option ${m === guessMeal() ? "selected" : ""}>${m}</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="fbeer"> Ist Bier/Alkohol</label>
    <label class="chk"><input type="checkbox" id="ffav"> Als Favorit speichern</label>
    <button class="btn block" id="fsave" style="margin-top:16px">Eintragen</button>`, (el) => {
    const recalc = () => { if (!per100) return; const g = parseFloat($("#fg", el).value.replace(",", ".")) || 0;
      $("#fk", el).value = Math.round(per100.kcal * g / 100); $("#fp", el).value = (per100.protein * g / 100).toFixed(1); };
    if (per100) { $("#fg", el).oninput = recalc; recalc(); }
    $("#fsave", el).onclick = async () => {
      const name = $("#fn", el).value.trim(), kcal = parseInt($("#fk", el).value), protein = parseFloat(($("#fp", el).value || "0").replace(",", ".")) || 0;
      if (!name || !(kcal >= 0)) return toast("Name und kcal eintragen");
      const meal = $("#fm", el).value, is_beer = $("#fbeer", el).checked;
      const grams = per100 ? parseFloat($("#fg", el).value.replace(",", ".")) || null : null;
      if ($("#ffav", el).checked) { const fav = await q(sb.from("favorites").insert({ name: grams ? `${name} ${Math.round(grams)} g` : name, kcal, protein, meal, is_beer }).select().single()); S.favs.push(fav); }
      el.close(); await insertFood({ name, kcal, protein, meal, is_beer, grams, barcode: pre.barcode || null });
    };
  });
}

async function offProduct(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity`);
  const j = await r.json(); if (j.status !== 1 || !j.product) return null;
  return offMap(j.product, code);
}
function offMap(p, code) {
  const n = p.nutriments || {};
  const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"] / 4.184 : null);
  if (kcal == null) return null;
  const name = [p.product_name_de || p.product_name, p.brands ? `(${String(p.brands).split(",")[0]})` : ""].filter(Boolean).join(" ");
  return { name: name || "Produkt", barcode: code || p.code, per100: { kcal: +kcal, protein: +(n.proteins_100g || 0) }, grams: +(p.serving_quantity) || 100 };
}

function scanSheet() {
  sheet(`<div class="row"><h1 class="grow">Barcode scannen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <video id="cam" playsinline muted></video><div class="small muted" id="scanmsg" style="margin:8px 0">Kamera wird gestartet …</div>
    <label class="f">Oder Nummer eintippen</label><div class="row"><input type="text" inputmode="numeric" id="code"><button class="btn" id="codego">OK</button></div>`, async (el) => {
    let stop = () => {}, done = false;
    el._cleanup = () => stop();
    const found = async (code) => {
      if (done) return; done = true; stop(); $("#scanmsg", el).textContent = `Gefunden: ${code} – suche Produkt …`;
      try { const p = await offProduct(code); el.close(); if (p) foodSheet(p); else { toast("Produkt nicht gefunden"); foodSheet({ barcode: code }); } }
      catch { el.close(); toast("Keine Verbindung zur Produktdatenbank"); foodSheet({ barcode: code }); }
    };
    $("#codego", el).onclick = () => { const c = $("#code", el).value.trim(); if (c) found(c); };
    try {
      if ("BarcodeDetector" in window) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const v = $("#cam", el); v.srcObject = stream; await v.play();
        const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
        let live = true; stop = () => { live = false; stream.getTracks().forEach((t) => t.stop()); };
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const loop = async () => { if (!live) return; try { const c = await det.detect(v); if (c[0]) return found(c[0].rawValue); } catch {} requestAnimationFrame(loop); };
        loop();
      } else {
        if (!window.ZXingBrowser) await loadScript("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const ctrl = await reader.decodeFromVideoDevice(undefined, $("#cam", el), (res) => { if (res) found(res.getText()); });
        stop = () => { try { ctrl.stop(); } catch {} };
      }
    } catch (e) { $("#scanmsg", el).textContent = "Kamera nicht verfügbar – Nummer eintippen geht immer."; }
  });
}

function searchSheet() {
  sheet(`<div class="row"><h1 class="grow">Produkt suchen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="row"><input type="search" id="sq" placeholder="z. B. Skyr, Laugenbrezel"><button class="btn" id="sgo">Los</button></div>
    <div class="list" id="sres" style="margin-top:12px"></div>`, (el) => {
    const run = async () => {
      const term = $("#sq", el).value.trim(); if (!term) return;
      $("#sres", el).innerHTML = `<div class="small muted">Suche …</div>`;
      try {
        const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=20&cc=de&lc=de&fields=code,product_name,product_name_de,brands,nutriments,serving_quantity`);
        const j = await r.json(); const items = (j.products || []).map((p) => offMap(p, p.code)).filter(Boolean);
        el._items = items;
        $("#sres", el).innerHTML = items.length ? items.map((p, i) => `<div class="it" data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="small muted num">${fmt(p.per100.kcal)} kcal/100 g</span></div>`).join("") : `<div class="small muted">Nichts gefunden. Probier's mit „Eigenes“.</div>`;
        $$("[data-i]", el).forEach((it) => it.onclick = () => { const p = el._items[+it.dataset.i]; el.close(); foodSheet(p); });
      } catch { $("#sres", el).innerHTML = `<div class="small muted">Keine Verbindung zur Produktdatenbank.</div>`; }
    };
    $("#sgo", el).onclick = run; $("#sq", el).onkeydown = (e) => { if (e.key === "Enter") run(); }; $("#sq", el).focus();
  });
}

function favSheet() {
  sheet(`<div class="row"><h1 class="grow">Favoriten</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="list">${S.favs.map((f) => `<div class="it"><span class="grow">${esc(f.name)}</span><span class="small muted num">${f.kcal} kcal, ${fmt(f.protein)} g Protein</span><button class="btn plain small" data-delfav="${f.id}">Löschen</button></div>`).join("")}</div>
    <div class="small muted" style="margin-top:10px">Neue Favoriten legst du über „Eigenes“ oder einen Barcode mit dem Haken „Als Favorit speichern“ an.</div>`, (el) => {
    $$("[data-delfav]", el).forEach((b) => b.onclick = async () => { await q(sb.from("favorites").delete().eq("id", b.dataset.delfav)); S.favs = S.favs.filter((f) => f.id !== b.dataset.delfav); b.closest(".it").remove(); render(); });
  });
}

// ---------- Login & Start ----------
function vLogin(msg = "") {
  $("#tabs").hidden = true;
  $("#app").innerHTML = `<div class="login"><div class="bib enter" style="margin-bottom:22px"><i class="h1"></i><i class="h2"></i>
      <div class="strip"><b>${RACE.name}</b><span>${monthDay(RACE.date)} 2027</span></div>
      <div class="no num" style="font-size:96px">Dennis</div><div class="cap" style="margin-bottom:6px">Startnummer abholen</div></div>
    <label class="f" for="le">E-Mail</label><input type="email" id="le" autocomplete="username">
    <label class="f" for="lp">Passwort</label><input type="password" id="lp" autocomplete="current-password">
    <button class="btn block" id="lgo" style="margin-top:18px">Anmelden</button>${msg ? `<p class="s" style="color:var(--bad);margin-top:12px">${esc(msg)}</p>` : ""}</div>`;
  $("#lgo").onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
    if (error) return vLogin("Anmeldung fehlgeschlagen: " + error.message);
    start();
  };
}
async function start() {
  $("#app").innerHTML = `<div class="sub" style="text-align:center;margin-top:40vh">Lade deine Daten …</div>`;
  try { await loadAll(); } catch (e) { $("#app").innerHTML = `<div class="panel">Daten konnten nicht geladen werden: ${esc(e.message || e)}<br><button class="btn" onclick="location.reload()" style="margin-top:12px">Neu laden</button></div>`; return; }
  $("#tabs").hidden = false;
  $$(".dock [data-t]").forEach((b) => b.onclick = () => go(b.dataset.t));
  $("#plus").onclick = quickSheet;
  render(); countUp();
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && sb && !$("#tabs").hidden && !document.querySelector(".sheet")) {
    try { await loadAll(); render(); } catch {}
  }
});
(async () => {
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"); }
  catch { $("#app").innerHTML = `<div class="card">Keine Verbindung. Bitte später nochmal öffnen.</div>`; return; }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(); else vLogin();
})();
</script>
