<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dennis">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">
<title>Dennis</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#f2f2f7; --ink:#000000; --ink2:#3c3c43; --sub:#8a8a8e; --sep:#e3e3e8;
  --acc:#e2231a; --acc-soft:#fde8e7;
  --z1:#a8b4c4; --z2:#3b82f6; --z3:#22c55e; --z4:#f59e0b; --z5:#ef4444;
  --ok:#22a55b; --warn:#f2a20c; --bad:#e2231a; --blue:#0a7aff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --ink:#ffffff; --ink2:#ebebf5; --sub:#8e8e93; --sep:#38383a;
  --acc:#ff3b30; --acc-soft:#3a1412; --z1:#5f6b7a; --blue:#0a84ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}.s{font-size:15px}.xs{font-size:13px}.small{font-size:13px}.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}

/* Navigationskopf (iOS Large Title) */
.nav{padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;background:var(--bg)}
.nav .t{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.nav .d{font-size:15px;color:var(--sub);font-weight:500;margin-bottom:2px}
.nav .r{display:flex;gap:8px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.navbtn{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.navbtn svg{width:18px;height:18px}

/* Feed-Abschnitte */
.sec{background:var(--card);padding:16px;margin-bottom:8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.sh .more{font-size:15px;color:var(--acc);font-weight:600}
.lbl{font-size:13px;color:var(--sub);font-weight:500}
.kv{display:flex;gap:22px}
.kv div b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv div span{font-size:13px;color:var(--sub)}

/* Ziel */
.goal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.goal .gt{font-size:15px;color:var(--sub);font-weight:500}
.goal .gh{font-size:20px;font-weight:700;letter-spacing:-.02em}
.goal .gd{text-align:right;grid-row:span 2}
.goal .gd b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.goal .gd span{font-size:13px;color:var(--sub)}
.weeksbar{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;margin-top:14px}
.weeksbar i{height:6px;border-radius:1px;background:var(--fill)}
.weeksbar i.past{background:var(--ink)}
.weeksbar i.now{background:var(--acc)}
.wbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}

/* Workout (Runna-Stil) */
.wo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wo-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sub)}
.wo-tag svg{width:15px;height:15px}
.wo-title{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px;line-height:1.15}
.wo-time{background:var(--fill);border-radius:8px;padding:6px 10px;text-align:center;flex:none}
.wo-time b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.wo-time span{font-size:12px;color:var(--sub)}
.wo-stats{display:flex;gap:22px;margin:14px 0 10px}
.wo-stats div b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wo-stats div span{font-size:13px;color:var(--sub)}
.struct{display:flex;align-items:flex-end;gap:2px;height:34px}
.struct i{display:block;border-radius:2px}
.struct .z1{background:var(--z1);height:30%}.struct .z2{background:var(--z2);height:50%}.struct .z3{background:var(--z3);height:68%}.struct .z4{background:var(--z4);height:84%}.struct .z5{background:var(--z5);height:100%}
.zl{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--sub)}
.zl span{display:inline-flex;align-items:center;gap:5px}.zl i{width:8px;height:8px;border-radius:2px}
.wo-desc{font-size:15px;color:var(--ink2);margin:12px 0 0}
.wo-note{font-size:14px;color:var(--blue);margin:8px 0 0;font-weight:500}
.wo-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wo-ex span{background:var(--fill);border-radius:6px;padding:5px 9px;font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:17px}
.cta svg{width:19px;height:19px}
.cta.done{background:var(--fill);color:var(--ok)}
.cta:active{opacity:.85}
.restday{display:flex;gap:14px;align-items:center}
.restday .ic{width:48px;height:48px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--sub)}
.restday .ic svg{width:24px;height:24px}
.restday b{font-size:19px;font-weight:700}
.restday p{margin:2px 0 0;font-size:15px;color:var(--sub)}
.tmrw{display:flex;gap:10px;align-items:center;border-top:.5px solid var(--sep);margin:16px -16px -16px;padding:12px 16px;font-size:15px}
.tmrw svg{width:18px;height:18px;color:var(--sub)}
.tmrw .grow b{font-weight:600}
.tmrw .grow span{color:var(--sub)}

/* Bereitschaft (Whoop-Stil) */
.ready{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gauge{position:relative;width:96px;height:96px}
.gauge svg{width:96px;height:96px;transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .gv b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.gauge .gv span{font-size:11px;color:var(--sub);font-weight:600}
.ready h3{margin:0 0 4px;font-size:19px;font-weight:700}
.ready p{margin:0;font-size:15px;color:var(--ink2)}
.rdots{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:.5px solid var(--sep);padding-top:12px}
.rdots div+div{border-left:.5px solid var(--sep);padding-left:12px}
.rdots b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rdots span{font-size:13px;color:var(--sub)}
.rdots em{font-style:normal;font-size:12px;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}
.coach{margin-top:14px;background:var(--fill);border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-line;color:var(--ink2)}
.coach b{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}

/* Woche (Strava-Bubbles) */
.bub{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.bub .c{height:58px;display:grid;place-items:center}
.bub .c i{display:block;border-radius:50%;background:var(--fill)}
.bub .c i.plan{background:transparent;border:1.5px dashed var(--sub)}
.bub .c i.done{background:var(--acc)}
.bub .c i.kraft{background:var(--ink);}
.bub .c i.krp{background:transparent;border:1.5px dashed var(--sub);border-radius:4px}
.bub .d{font-size:12px;color:var(--sub);font-weight:600}
.bub .d.today{color:var(--acc)}

/* Ringe */
.rings{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rings svg{width:92px;height:92px;transform:rotate(-90deg)}
.rl div{display:flex;align-items:baseline;gap:6px;padding:4px 0}
.rl div+div{border-top:.5px solid var(--sep)}
.rl i{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.rl b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rl span{font-size:14px;color:var(--sub)}

/* Gewicht */
.wtop{display:flex;justify-content:space-between;align-items:flex-end}
.wtop b{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wtop b small{font-size:17px;font-weight:600;color:var(--sub);margin-left:3px}
.chg{font-size:15px;font-weight:600}
.wchart{margin-top:10px}
.wchart text{font-size:11px;fill:var(--sub);font-family:var(--font)}

/* Listen */
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--sep)}
.list .it:first-child{border-top:0;padding-top:0}
.list .it:last-child{padding-bottom:0}
.kc{font-weight:600;font-variant-numeric:tabular-nums}
.x{color:var(--sub);padding:4px}.x svg{width:16px;height:16px}
.empty{color:var(--sub);font-size:15px;margin:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:8px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--fill);border-radius:10px;padding:10px 12px;text-align:left;min-width:120px;max-width:170px}
.chip:active{opacity:.7}
.chip .n{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.chip .v{font-size:15px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{background:var(--fill);border-radius:10px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:600}
.actions svg{width:22px;height:22px;color:var(--acc)}
.mealh{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin:16px 0 8px}
.mealh span{color:var(--sub);font-weight:500}
.daypick{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:10px 16px;margin-bottom:8px}
.daypick b{font-size:17px;font-weight:600}
.daypick button{color:var(--acc);padding:6px}
.daypick button svg{width:20px;height:20px}

/* Training: Aktivitäten-Feed */
.day{padding:14px 0;border-top:.5px solid var(--sep);display:grid;grid-template-columns:44px 1fr auto;gap:12px}
.day:first-child{border-top:0;padding-top:0}
.day .dt{text-align:center}
.day .dt span{display:block;font-size:12px;color:var(--sub);font-weight:600;text-transform:none}
.day .dt b{font-size:22px;font-weight:700}
.day.today .dt b{color:var(--acc)}
.day h4{margin:0;font-size:17px;font-weight:600}
.day .meta{font-size:14px;color:var(--sub);margin-top:2px}
.day .meta b{color:var(--ink);font-weight:600}
.day .struct{height:22px;margin-top:8px}
.day .ev{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-top:6px}
.day .ev svg{width:13px;height:13px;flex:none}
.day .mv{font-size:13px;color:var(--blue);margin-top:4px}
.day.off h4{color:var(--sub);font-weight:500}
.ck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sep);display:grid;place-items:center;color:transparent;margin-top:2px}
.ck svg{width:15px;height:15px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.act{border-top:.5px solid var(--sep);padding:14px 0}
.act:first-child{border-top:0;padding-top:0}
.act .ah{display:flex;gap:10px;align-items:center}
.act .ai{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.act .ai svg{width:18px;height:18px}
.act .an{font-weight:600}.act .ad{font-size:13px;color:var(--sub)}
.act .kv{margin-top:10px}
.zbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:10px}
.mile{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:6px}
.mile div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.mile i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--fill);min-height:2px}
.mile i.act{background:var(--acc)}
.mile i.cur{background:var(--acc);opacity:.5}
.mile span{font-size:10px;color:var(--sub)}

/* Formulare, Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:10px;padding:12px 18px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--fill);color:var(--ink)}.btn.plain{background:transparent;color:var(--acc);padding:8px}
.btn.block{width:100%;padding:14px;font-size:17px}.btn.small{padding:7px 12px;font-size:15px}
input[type=text],input[type=email],input[type=password],input[type=search],select{width:100%;padding:12px 14px;border-radius:10px;border:0;background:var(--fill);outline:none;font-size:17px}
input:focus,select:focus{box-shadow:0 0 0 2px var(--blue)}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 4px 6px;font-weight:500}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin-top:14px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:14px}

/* Tab Bar (iOS) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:flex-start;padding:6px 6px calc(env(safe-area-inset-bottom) + 4px);
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-top:.5px solid var(--sep)}
.dock button{flex:1;max-width:90px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--sub);padding:2px 0}
.dock button svg{width:26px;height:26px}
.dock button.on{color:var(--acc)}
.dock .plus{color:var(--acc)}
.dock .plus .pc{width:44px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;margin-top:1px}
.dock .plus .pc svg{width:20px;height:20px}

/* Sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:12px 12px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto}
.sheet .in::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:fade .2s ease both}.sheet .in{animation:up .3s cubic-bezier(.2,.8,.2,1) both}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px)}}
.sheet h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.sheet .row h1{flex:1}
.ibtn{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--sub)}
.ibtn svg{width:14px;height:14px}
.sheet .list{background:var(--card);border-radius:10px;padding:12px 14px;margin-top:12px}
.quick{background:var(--card);border-radius:10px;margin-top:14px}
.quick button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-align:left;font-size:17px}
.quick button+button{border-top:.5px solid var(--sep)}
.quick .qi{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.quick .qi svg{width:18px;height:18px}
.quick span.s{color:var(--sub);font-size:14px;display:block}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:15px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.on{opacity:1}
.lnk{color:var(--acc);text-decoration:none;font-size:15px}
.foot{display:flex;justify-content:center;gap:20px;padding:12px 0 6px}
.card,.panel{background:var(--card);padding:16px;border-radius:10px}
.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;padding:0 20px}
.login .logo{width:72px;height:72px;border-radius:16px;margin:0 auto 14px}
.login h1{text-align:center;font-size:28px;margin:0}
.login p.sub{text-align:center;margin:6px 0 18px}

.hero{position:relative;margin:0 0 8px;overflow:hidden;background:#000}
.hero svg{display:block;width:100%;height:250px}
.hx{position:absolute;left:16px;top:16px;right:16px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hk{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.hn{display:flex;align-items:flex-end;gap:10px;margin-top:2px}
.hn b{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.hn span{font-size:14px;font-weight:600;line-height:1.2;padding-bottom:6px;opacity:.95}
.hw{font-size:14px;font-weight:600;margin-top:6px;opacity:.9}
.wb{margin:0 -16px 14px;height:128px;overflow:hidden}
.wb svg{display:block;width:100%;height:128px}
.wb text{font-size:12px;font-weight:700;fill:#1c1c1e;opacity:.75;font-family:inherit}.wb text.wt{fill:#fff;opacity:.85;font-weight:600}
.stairs text{font-size:11px;fill:var(--sub);font-family:inherit}
.stairs text.sb{font-size:12px;font-weight:700;fill:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="dock" id="tabs" hidden>
  <button data-t="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-t="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1.5-3 4-3 8h3"/></svg>Essen</button>
  <button class="plus" id="plus" aria-label="Schnell eintragen"><span class="pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-t="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0M7 21l3-6 3 2v4M6 12l2-3 4-1 3 3 3 1M10 15l1-4"/></svg>Training</button>

function workout(p) {
  if (!p) return [];

  const add = (z, min) => segs.push({ z, min });
  if (p.kind === "walk") { add(1, 40); return segs; }
  if (p.kind === "race") { add(1, 10); add(3, 115); return segs; }
  if (p.kind === "run_easy") {
    const total = Math.max(20, Math.round(km * 7)) || 25;
    add(1, 5); add(2, total - 5);
    if (/Steigerungen/.test(d)) for (let i = 0; i < 5; i++) { add(4, .4); add(1, 1); }
    if (/3 × 1 km HM/.test(d)) { for (let i = 0; i < 3; i++) { add(3, 5.6); add(1, 2); } }
    return segs;
  }
  if (p.kind === "long") {
    const total = Math.round(km * 7.2) || 60;
    const hm = /HM-Tempo/.test(d) ? 35 : 0;
    add(1, 5); add(2, total - 5 - hm); if (hm) add(3, hm);
    if (/Test/.test(p.title)) { segs.length = 0; add(1, 15); add(5, /10-km/.test(p.title) ? 52 : 27); add(1, 10); }
    return segs;
  }
  if (p.kind === "run_quality") {

    if ((m = d.match(/(\d) × (\d+) min/))) for (let i = 0; i < +m[1]; i++) { add(4, +m[2]); if (i < +m[1] - 1) add(1, 3); }

    else add(3, 30);
    add(1, 10);
    return segs;
  }
  return segs;
}

  if (h >= 9 && h < 17) return { s: ["#4aa3ff", "#8cc8ff", "#d8ecff"], sun: "#ffffff", sunY: 52, far: "#8db3d6", near: "#1d3557", water: "#5c97cf", stars: 0 };
  if (h >= 17 && h < 21) return { s: ["#3b2a6e", "#e2231a", "#ffb05c"], sun: "#ffe0a3", sunY: 132, far: "#a1476a", near: "#26122e", water: "#c4453f", stars: 0 };
  return { s: ["#070b1f", "#141c45", "#2b2f66"], sun: "#f4f1e6", sunY: 46, far: "#2a3266", near: "#05060f", water: "#1a2050", stars: 1 };
}

  const dom = `${tower(262)}${tower(296)}<path d="M280 ${G}V128h16V${G}zM314 ${G}V134l6-8h44l6 8V${G}zM346 126l4-24 4 24z"/>`;
  // Kranhäuser
  const kran = [22, 64, 106].map((x) => `<path d="M${x} ${G}V128h40v14H${x + 10}V${G}z"/>`).join("");
  // Hohenzollernbrücke
  const arch = (x) => `<path d="M${x} 172Q${x + 15} 146 ${x + 30} 172" fill="none" stroke="${T.near}" stroke-width="3"/>`;
  const bridge = ``;
  const far = `<g fill="${T.far}"><path d="M0 ${G}V160h18v-8h20v34zM150 ${G}V150h14v36zM168 ${G}V142h4V58h2V46h2v12h2v84h4v44z"/><ellipse cx="175" cy="70" rx="7" ry="4"/><path d="M196 ${G}V136h22l-4 50zM350 ${G}V112h18v74zM372 ${G}V150h18v36z"/></g>`;
  const x0 = 18, x1 = 372, rx = x0 + (x1 - x0) * Math.max(0, Math.min(1, frac));
  return `<div class="hero"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.s[0]}"/><stop offset=".6" stop-color="${T.s[1]}"/><stop offset="1" stop-color="${T.s[2]}"/></linearGradient>
      <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.water}"/><stop offset="1" stop-color="${T.near}"/></linearGradient>

    <rect width="${W}" height="${H}" fill="url(#sky)"/>${stars}
    <circle cx="236" cy="${T.sunY}" r="60" fill="url(#glow)"/><circle cx="236" cy="${T.sunY}" r="17" fill="${T.sun}"/>
    ${far}<g fill="${T.near}">${kran}${dom}${bridge}<rect x="0" y="${G}" width="${W}" height="6"/></g>
    <rect x="0" y="${G + 6}" width="${W}" height="${H - G}" fill="url(#wat)"/>
    ${[0, 1, 2, 3, 4].map((i) => `<rect x="${212 + i * 7}" y="${G + 12 + i * 8}" width="${50 - i * 8}" height="1.5" fill="${T.sun}" opacity="${.5 - i * .08}"/>`).join("")}
    <line x1="${x0}" y1="226" x2="${x1}" y2="226" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
    <line x1="${x0}" y1="226" x2="${rx}" y2="226" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${rx}" cy="226" r="7" fill="var(--acc)" stroke="#fff" stroke-width="2.5"/>

function woBanner(p, segs) {
  const k = p ? p.kind : "rest", W = 390, H = 128;
  if (k.startsWith("kraft")) {
    const plate = (x, h) => `<rect x="${x}" y="${64 - h / 2}" width="13" height="${h}" rx="3"/>`;
    return `<div class="wb" style="background:linear-gradient(135deg,#1c1c1e,#3a3a3c)"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g opacity=".08" fill="#fff">${[...Array(9)].map((_, i) => `<rect x="${i * 48 - 10}" y="0" width="24" height="${H}" transform="skewX(-20)"/>`).join("")}</g>
      <g transform="rotate(-14 195 64)"><rect x="110" y="59" width="170" height="10" rx="3" fill="#8e8e93"/><g fill="var(--acc)">${plate(122, 76)}${plate(137, 60)}${plate(240, 60)}${plate(255, 76)}</g><g fill="#c7c7cc"><rect x="100" y="56" width="10" height="16" rx="2"/><rect x="280" y="56" width="10" height="16" rx="2"/></g></g>
    </svg></div>`;
  }
  if (!p || !isTrain(p)) {
    return `<div class="wb" style="background:linear-gradient(180deg,#0b1030,#2b2f66)"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      ${[...Array(30)].map((_, i) => `<circle cx="${(i * 71) % W}" cy="${(i * 37) % 100 + 6}" r="${i % 5 ? .8 : 1.4}" fill="#fff" opacity="${.3 + (i % 3) * .2}"/>`).join("")}
      <circle cx="300" cy="46" r="22" fill="#f4f1e6"/><circle cx="311" cy="40" r="20" fill="#16204a"/>
      <path d="M0 110Q100 80 200 104T390 96V128H0z" fill="#05060f"/></svg></div>`;
  }
  const pal = { run_quality: ["#ff5f3a", "#e2231a", "#7a0f0a"], long: ["#8e6bff", "#4b2bd1", "#1d0f5c"], race: ["#ffcf3a", "#e2231a", "#1c1c1e"], walk: ["#7fd6a0", "#22a55b", "#0b3d22"] }[k] || ["#5ac8fa", "#0a7aff", "#06265a"];
  const tot = segs.reduce((s, x) => s + x.min, 0) || 1, gap = 3, usable = W - 32 - gap * (segs.length - 1); let x = 16;
  const bars = segs.map((sg) => { const w = Math.max(3, sg.min / tot * usable), h = 18 + sg.z * 16, y = H - 26 - h;
    const r = `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" rx="3" fill="#fff" fill-opacity="${.3 + sg.z * .14}"/>${w > 62 ? `<text x="${(x + 8).toFixed(1)}" y="${y + 16}">${ZNAME[sg.z]}</text>` : ""}`; x += w + gap; return r; }).join("");
  return `<div class="wb" style="background:linear-gradient(160deg,${pal[0]},${pal[1]} 55%,${pal[2]})"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${bars}<text x="16" y="${H - 9}" class="wt">0 min</text><text x="${W - 16}" y="${H - 9}" text-anchor="end" class="wt">${Math.round(tot)} min</text></svg></div>`;
}

function stairs() {
  const steps = [[START.date, START.kg], ...MILESTONES.filter(([, kg]) => kg >= GOAL_KG)];
  const now = weightAvg(today()) ?? latestWeight() ?? START.kg;
  const W = 340, H = 150, n = steps.length, sw = W / n, top = 18, hi = START.kg, lo = GOAL_KG;
  const y = (v) => top + (hi - v) / (hi - lo) * (H - top - 34);
  let reached = 0; steps.forEach(([, kg], i) => { if (now <= kg + 0.05) reached = i; });
  const blocks = steps.map(([d, kg], i) => { const on = i <= reached;
    return `<rect x="${i * sw + 1}" y="${y(kg)}" width="${sw - 2}" height="${H - 20 - y(kg)}" rx="3" fill="${on ? "var(--acc)" : "var(--fill)"}" ${on ? "" : ""}/>
      <text x="${i * sw + sw / 2}" y="${y(kg) - 6}" text-anchor="middle" class="sb">${fmt(kg, kg % 1 ? 1 : 0)}</text>
      <text x="${i * sw + sw / 2}" y="${H - 4}" text-anchor="middle">${i ? dShort(d).replace(/^\w+\.,\s*/, "") : "Start"}</text>`; }).join("");
  const cx = reached * sw + sw / 2, cy = y(steps[reached][1]) + 18;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="stairs" role="img" aria-label="Zwischenziele als Treppe">${blocks}
    <circle cx="${cx}" cy="${cy}" r="9" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--acc)"/>
    <g transform="translate(${(n - 1) * sw + sw / 2 + 16} ${y(lo) - 24})"><path d="M0 0v20" stroke="var(--ink)" stroke-width="1.5"/><path d="M1 0h12l-3 4 3 4H1z" fill="var(--ink)"/></g></svg>`;
}

function vTraining() {
  const view = S.trView || "plan";

  if (view === "akt") {
    const weeks = [...Array(12)].map((_, i) => mondayOf(addDays(today(), -7 * (11 - i))));
    const km = weeks.map((w) => [...Array(7)].flatMap((_, j) => actsOn(addDays(w, j))).filter((a) => RUN_TYPES.includes(a.type)).reduce((s, a) => s + (a.distance_km || 0), 0));
    const mx = Math.max(10, ...km);

      <div class="kv"><div><b>${fmt(km.at(-1), 1)} km</b><span>diese Woche</span></div><div><b>${fmt(km.reduce((a, b) => a + b, 0) / 12, 1)} km</b><span>Schnitt pro Woche</span></div></div>
      <div class="mile">${km.map((v, i) => `<div><i class="${i === 11 ? "cur" : v ? "act" : ""}" style="height:${Math.max(2, v / mx * 100)}%"></i><span>${i % 3 === 2 || i === 11 ? dayNum(weeks[i]) + "." + +weeks[i].slice(5, 7) + "." : ""}</span></div>`).join("")}</div></section>
    <section class="sec">${acts.length ? acts.map((a) => { const run = RUN_TYPES.includes(a.type);
      return `<div class="act"><div class="ah"><div class="ai">${run ? ICO.run : a.type === "Kraft" ? ICO.dumbbell : ICO.bolt}</div><div class="grow"><div class="an">${esc(a.name || a.type)}</div><div class="ad">${dLong(a.date)}${a.start ? `, ${esc(a.start)}` : ""}</div></div></div>
        <div class="kv">${a.distance_km ? `<div><b>${fmt(a.distance_km, 1)} km</b><span>Distanz</span></div>` : ""}${run ? `<div><b>${pace(a)} /km</b><span>Pace</span></div>` : ""}<div><b>${a.duration_min} min</b><span>Zeit</span></div>${a.avg_hr ? `<div><b>${a.avg_hr}</b><span>Ø Puls</span></div>` : ""}</div></div>`; }).join("")
      : `<p class="empty">Noch keine Aktivitäten.</p>`}</section>`;

function spark(rows, key, color, band) {
  const W = 320, H = 54, pts = rows.map((r, i) => [i, r[key]]).filter(([, v]) => v != null);
  if (pts.length < 2) return `<div class="xs sub">Zu wenig Daten</div>`;
  const vs = pts.map(([, v]) => v).concat(band ? rows.flatMap((r) => [r[band[0]], r[band[1]]]).filter((v) => v != null) : []);
  const lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1, n = rows.length - 1 || 1;
  const x = (i) => 4 + i / n * (W - 8), y = (v) => 5 + (hi - v) / (hi - lo) * (H - 10);
  let b = "";
  if (band) { const top = rows.map((r, i) => r[band[1]] != null ? `${x(i)},${y(r[band[1]])}` : null).filter(Boolean), bot = rows.map((r, i) => r[band[0]] != null ? `${x(i)},${y(r[band[0]])}` : null).filter(Boolean).reverse();
    if (top.length > 1) b = `<polygon points="${top.concat(bot).join(" ")}" fill="${color}" opacity=".12"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${b}<polyline points="${pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(pts.at(-1)[0])}" cy="${y(pts.at(-1)[1])}" r="3.5" fill="${color}"/></svg>`;
}

function weightChart(small) {
  const W = 340, H = small ? 110 : 170, pad = { l: 28, r: 6, t: 8, b: 18 };
  const pts = S.weights.filter((w) => w.kg).map((w) => ({ d: w.date, v: +w.kg }));
  const path = [[START.date, START.kg], ...MILESTONES];
  const end = pts.length && pts.at(-1).d > addDays(today(), 42) ? pts.at(-1).d : addDays(today(), 42);
  const goalAt = (d) => { for (let i = 1; i < path.length; i++) { const [d0, v0] = path[i - 1], [d1, v1] = path[i]; if (d <= d1) return v0 + (v1 - v0) * daysBetween(d0, d) / daysBetween(d0, d1); } return path.at(-1)[1]; };
  const gp = path.filter(([d]) => d < end).concat([[end, goalAt(end)]]);
  const x0 = pts.length && pts[0].d < START.date ? pts[0].d : START.date, span = Math.max(30, daysBetween(x0, end));
  const vals = [...pts.map((p) => p.v), ...gp.map(([, v]) => v), START.kg];
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const x = (d) => pad.l + daysBetween(x0, d) / span * (W - pad.l - pad.r);
  const y = (v) => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const ticks = []; for (let v = hi; v >= lo; v -= Math.max(1, Math.round((hi - lo) / (small ? 2 : 4)))) ticks.push(v);
  const avgLine = pts.map((p) => [p.d, weightAvg(p.d)]).filter(([, v]) => v);
  const area = avgLine.length > 1 ? `<polygon points="${avgLine.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")} ${x(avgLine.at(-1)[0]).toFixed(1)},${H - pad.b} ${x(avgLine[0][0]).toFixed(1)},${H - pad.b}" fill="var(--acc)" opacity=".08"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gewichtsverlauf">
    ${ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width=".8"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    <polyline points="${gp.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--sub)" stroke-dasharray="3 4" stroke-width="1.2"/>
    ${avgLine.length > 1 ? `<polyline points="${avgLine.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${pts.map((p) => `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="2.6" fill="var(--acc)" opacity=".5"/>`).join("")}
    <text x="${pad.l}" y="${H - 3}">${dShort(x0)}</text><text x="${W - pad.r}" y="${H - 3}" text-anchor="end">${dShort(end)}</text>
  </svg>`;
}

    <div class="rdots"><div><b>${last.sleep_score ?? "–"}</b><span>Schlaf-Score</span></div><div><b>${last.sleep_h != null ? fmt(last.sleep_h, 1) : "–"} h</b><span>geschlafen</span></div><div><b>${last.sleep_start ?? "–"}</b><span>eingeschlafen</span></div></div></section>
  <section class="sec"><div class="sh"><h2>Trends</h2><span class="xs sub">3 Wochen</span></div>
    <div class="row" style="justify-content:space-between"><span class="s">HRV <span class="xs sub">Normalbereich schattiert</span></span><b class="num">${lastHrv.hrv_night ?? "–"} ms</b></div>${spark(rows, "hrv_night", "var(--blue)", ["hrv_base_low", "hrv_base_high"])}

function go(t) { S.tab = t; if (t === "essen") S.essenDay = today(); render(); }

async function toggleDone(d) {
  const p = planOn(d); if (!p) return;
  const done = !p.done;
  await q(sb.from("plan").update({ done, done_at: done ? new Date().toISOString() : null }).eq("date", d));
  p.done = done; S._stamp = done ? d : null; render(); if (done) toast(["Stark gemacht", "Erledigt", "Läuft bei dir", "Abgehakt"][Math.floor(Math.random() * 4)]);
}

async function insertFood(f) {
  const row = await q(sb.from("foods").insert({ day: S.essenDay, ...f }).select().single());
  S.foods.push(row); render(); toast(`+${row.kcal} kcal`);
}
async function addFav(id) {
  const f = S.favs.find((x) => x.id === id); if (!f) return;
  await insertFood({ name: f.name, kcal: f.kcal, protein: f.protein, meal: f.meal || guessMeal(), is_beer: f.is_beer });
}
async function delFood(id) { await q(sb.from("foods").delete().eq("id", id)); S.foods = S.foods.filter((f) => f.id !== id); render(); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Frühstück" : h < 15 ? "Mittag" : h < 18 ? "Snack" : "Abend"; }

async function saveWeight() {
  const kg = parseFloat(($("#wkg").value || "").replace(",", ".")), waist = parseFloat(($("#wwaist").value || "").replace(",", "."));
  if (!kg && !waist) return toast("Gewicht oder Bauchumfang eintragen");
  if (kg && (kg < 50 || kg > 200)) return toast("Das Gewicht wirkt unrealistisch");
  const row = { date: today(), kg: kg || null, waist_cm: waist || null, source: "app", updated_at: new Date().toISOString() };
  await q(sb.from("weights").upsert(row, { onConflict: "date" }));
  S.weights = S.weights.filter((w) => w.date !== row.date).concat(row).sort((a, b) => a.date < b.date ? -1 : 1);
  render(); toast("Gewicht gespeichert");
}
async function delWeight(d) { await q(sb.from("weights").delete().eq("date", d)); S.weights = S.weights.filter((w) => w.date !== d); render(); }

// ---------- Sheets ----------
function sheet(html, onOpen) {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="in">${html}</div>`;
  el.onclick = (e) => { if (e.target === el) close(); };
  const close = () => { el.remove(); if (el._cleanup) el._cleanup(); };
  el.close = close; document.body.append(el);
  $$("[data-close]", el).forEach((b) => b.onclick = close);
  if (onOpen) onOpen(el);
  return el;
}

async function offProduct(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity`);
  const j = await r.json(); if (j.status !== 1 || !j.product) return null;
  return offMap(j.product, code);
}
function offMap(p, code) {
  const n = p.nutriments || {};
  const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"] / 4.184 : null);
  if (kcal == null) return null;
  const name = [p.product_name_de || p.product_name, p.brands ? `(${String(p.brands).split(",")[0]})` : ""].filter(Boolean).join(" ");
  return { name: name || "Produkt", barcode: code || p.code, per100: { kcal: +kcal, protein: +(n.proteins_100g || 0) }, grams: +(p.serving_quantity) || 100 };
}

function scanSheet() {
  sheet(`<div class="row"><h1 class="grow">Barcode scannen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <video id="cam" playsinline muted></video><div class="small muted" id="scanmsg" style="margin:8px 0">Kamera wird gestartet …</div>
    <label class="f">Oder Nummer eintippen</label><div class="row"><input type="text" inputmode="numeric" id="code"><button class="btn" id="codego">OK</button></div>`, async (el) => {
    let stop = () => {}, done = false;
    el._cleanup = () => stop();
    const found = async (code) => {
      if (done) return; done = true; stop(); $("#scanmsg", el).textContent = `Gefunden: ${code} – suche Produkt …`;
      try { const p = await offProduct(code); el.close(); if (p) foodSheet(p); else { toast("Produkt nicht gefunden"); foodSheet({ barcode: code }); } }
      catch { el.close(); toast("Keine Verbindung zur Produktdatenbank"); foodSheet({ barcode: code }); }
    };
    $("#codego", el).onclick = () => { const c = $("#code", el).value.trim(); if (c) found(c); };
    try {
      if ("BarcodeDetector" in window) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const v = $("#cam", el); v.srcObject = stream; await v.play();
        const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
        let live = true; stop = () => { live = false; stream.getTracks().forEach((t) => t.stop()); };
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const loop = async () => { if (!live) return; try { const c = await det.detect(v); if (c[0]) return found(c[0].rawValue); } catch {} requestAnimationFrame(loop); };
        loop();
      } else {
        if (!window.ZXingBrowser) await loadScript("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const ctrl = await reader.decodeFromVideoDevice(undefined, $("#cam", el), (res) => { if (res) found(res.getText()); });
        stop = () => { try { ctrl.stop(); } catch {} };
      }
    } catch (e) { $("#scanmsg", el).textContent = "Kamera nicht verfügbar – Nummer eintippen geht immer."; }
  });
}

function searchSheet() {
  sheet(`<div class="row"><h1 class="grow">Produkt suchen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="row"><input type="search" id="sq" placeholder="z. B. Skyr, Laugenbrezel"><button class="btn" id="sgo">Los</button></div>
    <div class="list" id="sres" style="margin-top:12px"></div>`, (el) => {
    const run = async () => {
      const term = $("#sq", el).value.trim(); if (!term) return;
      $("#sres", el).innerHTML = `<div class="small muted">Suche …</div>`;
      try {
        const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=20&cc=de&lc=de&fields=code,product_name,product_name_de,brands,nutriments,serving_quantity`);
        const j = await r.json(); const items = (j.products || []).map((p) => offMap(p, p.code)).filter(Boolean);
        el._items = items;
        $("#sres", el).innerHTML = items.length ? items.map((p, i) => `<div class="it" data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="small muted num">${fmt(p.per100.kcal)} kcal/100 g</span></div>`).join("") : `<div class="small muted">Nichts gefunden. Probier's mit „Eigenes“.</div>`;
        $$("[data-i]", el).forEach((it) => it.onclick = () => { const p = el._items[+it.dataset.i]; el.close(); foodSheet(p); });
      } catch { $("#sres", el).innerHTML = `<div class="small muted">Keine Verbindung zur Produktdatenbank.</div>`; }
    };
    $("#sgo", el).onclick = run; $("#sq", el).onkeydown = (e) => { if (e.key === "Enter") run(); }; $("#sq", el).focus();
  });
}

function favSheet() {
  sheet(`<div class="row"><h1 class="grow">Favoriten</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="list">${S.favs.map((f) => `<div class="it"><span class="grow">${esc(f.name)}</span><span class="small muted num">${f.kcal} kcal, ${fmt(f.protein)} g Protein</span><button class="btn plain small" data-delfav="${f.id}">Löschen</button></div>`).join("")}</div>
    <div class="small muted" style="margin-top:10px">Neue Favoriten legst du über „Eigenes“ oder einen Barcode mit dem Haken „Als Favorit speichern“ an.</div>`, (el) => {
    $$("[data-delfav]", el).forEach((b) => b.onclick = async () => { await q(sb.from("favorites").delete().eq("id", b.dataset.delfav)); S.favs = S.favs.filter((f) => f.id !== b.dataset.delfav); b.closest(".it").remove(); render(); });
  });
}

// ---------- Login & Start ----------
function vLogin(msg = "") {
  $("#tabs").hidden = true;
  $("#app").innerHTML = `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Dennis</h1><p class="s sub">${RACE.name}, ${monthDay(RACE.date)} 2027</p>
    <label class="f" for="le">E-Mail</label><input type="email" id="le" autocomplete="username">
    <label class="f" for="lp">Passwort</label><input type="password" id="lp" autocomplete="current-password">
    <button class="btn block" id="lgo" style="margin-top:18px">Anmelden</button>${msg ? `<p class="s" style="color:var(--bad);margin-top:12px">${esc(msg)}</p>` : ""}</div>`;
  $("#lgo").onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
    if (error) return vLogin("Anmeldung fehlgeschlagen: " + error.message);
    start();
  };
}
async function start() {
  $("#app").innerHTML = `<div class="sub" style="text-align:center;margin-top:40vh">Lade deine Daten …</div>`;
  try { await loadAll(); } catch (e) { $("#app").innerHTML = `<div class="panel">Daten konnten nicht geladen werden: ${esc(e.message || e)}<br><button class="btn" onclick="location.reload()" style="margin-top:12px">Neu laden</button></div>`; return; }
  $("#tabs").hidden = false;
  $$(".dock [data-t]").forEach((b) => b.onclick = () => go(b.dataset.t));
  $("#plus").onclick = quickSheet;
  render(); countUp();
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && sb && !$("#tabs").hidden && !document.querySelector(".sheet")) {
    try { await loadAll(); render(); } catch {}
  }
});
(async () => {
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"); }
  catch { $("#app").innerHTML = `<div class="card">Keine Verbindung. Bitte später nochmal öffnen.</div>`; return; }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(); else vLogin();
})();
</script>
