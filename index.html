<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dennis">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Dennis</title>
<style>
:root{
  --ground:#eceef1; --paper:#ffffff; --ink:#111318; --sub:#5b616b; --faint:#9399a3; --line:#d6d9de;
  --train:#2343e8; --fuel:#ffd60a; --body:#10a05c; --rest:#6b4cf2; --signal:#ffd60a;
  --ok:#10a05c; --warn:#f0a400; --bad:#e0352b;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --text:"Instrument Sans",-apple-system,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root{
  --ground:#0e1013; --paper:#1a1d22; --ink:#f1f2f4; --sub:#9aa0aa; --faint:#666c76; --line:#2b2f36;
  --train:#3d5cff; --fuel:#ffd60a; --body:#14b368; --rest:#7a5cff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--train);outline-offset:2px}
#app{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 92px);max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}.faint{color:var(--faint)}.s{font-size:14px}.xs{font-size:12.5px}.small{font-size:13.5px}.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
svg{display:block}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 0 4px}
.top .hello{font-family:var(--display);font-weight:900;font-size:42px;line-height:.9}
.top .date{color:var(--sub);font-size:14.5px;margin-top:6px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;color:var(--ink);background:var(--paper);border:1.5px solid var(--line)}
.ibtn svg{width:20px;height:20px}

/* Startnummer als Leiste */
.bibrow{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;background:#fff;color:#111318;padding:14px 26px 14px 26px;
  box-shadow:0 14px 30px -20px rgba(17,19,24,.45);border-top:8px solid var(--train)}
.bibrow i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ground);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.bibrow .h1{left:9px;top:10px}.bibrow .h2{right:9px;top:10px}.bibrow .h3{left:9px;bottom:10px}.bibrow .h4{right:9px;bottom:10px}
.bibrow .bn{font-weight:900;font-size:84px;line-height:.8;letter-spacing:-.01em}
.bibrow .bt b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.bibrow .bt span{display:block;font-size:13.5px;color:#5b616b;margin-top:4px}
.bibrow .bt em{display:block;font-style:normal;font-size:13.5px;margin-top:6px;color:#111318}
@media (prefers-reduced-motion:no-preference){.bibrow.enter{animation:pin .7s var(--ease) both}}
@keyframes pin{from{transform:rotate(-2deg) translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* Farbblöcke */
.blk{position:relative;padding:16px;overflow:hidden}
.blk.train{background:var(--train);color:#fff}
.blk.fuel{background:var(--fuel);color:#111318}
.blk.body{background:var(--body);color:#fff}
.blk.rest{background:var(--rest);color:#fff}
.blk .lbl{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;opacity:.9}
.blk .lbl svg{width:17px;height:17px}
.blk .val{font-weight:900;font-size:54px;line-height:.85;margin-top:12px}
.blk .unit{font-weight:600;font-size:14px;opacity:.85;margin-top:4px}
.blk .mini{font-size:12.5px;font-weight:600;opacity:.85;margin-top:8px}
.blk .split{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.blk .side{text-align:right}
.blk .side b{display:block;font-weight:900;font-size:34px;line-height:.9}
.blk .side span{font-size:13px;opacity:.85}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .blk{cursor:pointer;min-height:206px;display:flex;flex-direction:column}
.duo .blk .mini{margin-top:auto;padding-top:8px}
.duo .val{font-size:48px}

/* Ampel */
.amp{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 10px 6px 8px;font-size:13.5px}
.amp b{font-weight:800}
.amp .lamp{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.amp.gruen .lamp{background:#3ee08a}.amp.gelb .lamp{background:var(--signal)}.amp.rot .lamp{background:#ff5a4f}.amp.grau .lamp{background:#c9ccd2}

/* Heute-Block */
.blk.train .tb-grid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px}
.tb-time b{display:block;font-family:var(--display);font-weight:900;font-size:64px;line-height:.82}
.tb-time span{font-size:14px;font-weight:600;opacity:.85}
.tb-km{text-align:right}.tb-km b{display:block;font-family:var(--display);font-weight:900;font-size:44px;line-height:.85;color:var(--signal)}
.tb-km span{font-size:14px;font-weight:700;color:var(--signal)}
.tb-kind{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;opacity:.85;margin-top:18px}
.tb-kind svg{width:17px;height:17px}
.tb-title{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;margin:4px 0 6px}
.tb-det{margin:0;font-size:15px;opacity:.9;max-width:36ch}
.tb-note{margin:8px 0 0;font-size:13.5px;font-weight:700;color:var(--signal)}
.tb-done{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:15px;background:#fff;color:var(--train);font-weight:800;font-size:16px;transition:transform .12s var(--ease)}
.tb-done:active{transform:scale(.98)}
.tb-done svg{width:20px;height:20px}
.blk.train.is-done{background:var(--body)}
.blk.train.is-done .tb-done{color:var(--body)}
.stamp{position:relative;margin-bottom:10px;font-family:var(--display);font-weight:900;font-size:26px;color:#fff;border:3px solid #fff;padding:0 8px;transform:rotate(-8deg)}
@media (prefers-reduced-motion:no-preference){.stamp.pop{animation:stamp .45s var(--ease) both}}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}

/* Wochenpunkte */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.wk .wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;opacity:.8}
.wk .wd.today{opacity:1}
.wk .wd.today span{background:#fff;color:var(--train);padding:0 5px}
.wk i{width:26px;height:26px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.45)}
.wk i svg{width:14px;height:14px}
.wk i.off{border-style:dotted;border-color:rgba(255,255,255,.3)}
.wk i.hard{background:rgba(255,255,255,.18)}
.wk i.done{background:#fff;color:var(--body);border-color:#fff}
.wk i.miss{opacity:.5}
.wk i.race{background:var(--signal);color:#111;border-color:var(--signal)}

/* Tankanzeige */
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:12px}
.segs i{height:16px;background:rgba(17,19,24,.13)}
.segs i.f{background:#111318}
.segs i.p{background:linear-gradient(90deg,#111318 var(--pp),rgba(17,19,24,.13) var(--pp))}
.segs.over i.f{background:var(--bad)}
.blk.fuel.big .segs i{height:24px}
.pbar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;font-weight:600}
.pbar div{flex:1;height:6px;background:rgba(17,19,24,.13)}
.pbar i{display:block;height:100%;background:#111318}
.pbar b{font-weight:800;font-size:17px}

/* Lineal */
.ruler{width:100%;height:auto;color:#fff;margin-top:10px;overflow:visible}
.ruler text{font-family:var(--display);font-weight:700;font-size:13px;fill:currentColor;opacity:.85}

/* Erholung */
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px}
.trio div+div{border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.trio b{display:block;font-weight:900;font-size:34px;line-height:.9}
.trio span{font-size:12.5px;opacity:.85}
.blk.rest .amp{margin-top:12px}
.sp{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}
.sp-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;opacity:.95}
.sp-h b{font-weight:900;font-size:24px}
.spark{width:100%;height:56px;margin-top:4px;color:#fff}

/* Coach + Hinweise */
.coachline{background:var(--paper);border-left:6px solid var(--train);padding:12px 14px}
.coachline b{font-family:var(--display);font-weight:800;font-size:18px}
.coachline p{margin:4px 0 0;white-space:pre-line;font-size:15px}
.aside{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.aside div{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--sub)}
.aside svg{width:15px;height:15px;flex:none;margin-top:2px}

/* Serien */
.streaks{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);color:var(--ground)}
.streaks div{padding:14px 12px}
.streaks div+div{border-left:1px solid rgba(255,255,255,.15)}
.streaks b{display:block;font-weight:900;font-size:36px;line-height:.9;color:var(--signal)}
.streaks span{font-size:12.5px;opacity:.85}

/* Allgemeine Flächen */
.sect{margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.sec-h h2{font-family:var(--display);font-weight:900;font-size:26px;margin:0;line-height:1}
.paper{background:var(--paper);padding:12px 10px 6px}
.empty{margin:0;padding:14px;background:var(--paper);color:var(--sub);font-size:14.5px;border-left:6px solid var(--line)}
.list.rows{background:var(--paper);padding:2px 14px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.kc{font-weight:800;font-size:19px}
.meal{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px}
.meal span{font-family:var(--display);font-weight:800;font-size:20px}
.meal b{font-size:17px;color:var(--sub)}
.x{color:var(--faint);padding:4px}.x svg{width:16px;height:16px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:var(--ink);color:var(--ground);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:14px}
.tool svg{width:24px;height:24px;color:var(--fuel)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--paper);border-top:4px solid var(--fuel);padding:10px 12px;text-align:left;min-width:118px;max-width:170px}
.chip:active{transform:scale(.96)}
.chip .n{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.chip .v{font-weight:800;font-size:22px;margin-top:4px}.chip .v small{font-size:13px;color:var(--sub)}
.chip.beer{border-top-color:var(--warn)}

/* Training */
.phases{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;margin-top:16px}
.phases i{height:14px;background:rgba(255,255,255,.22)}
.phases i.past{background:rgba(255,255,255,.6)}
.phases i.now{background:var(--signal)}
.phlab{display:grid;grid-template-columns:repeat(26,1fr);gap:2px;font-size:10.5px;font-weight:600;opacity:.85;margin-top:6px}
.phlab span{white-space:nowrap;overflow:visible}
.days{display:flex;flex-direction:column;gap:6px}
.dy{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:start;background:var(--paper);padding:12px 14px 12px 0;border-left:6px solid var(--line)}
.dy.run{border-left-color:var(--train)}.dy.hard{border-left-color:var(--train)}.dy.kraft{border-left-color:var(--ink)}
.dy.done{border-left-color:var(--body)}.dy.race{border-left-color:var(--fuel)}.dy.off{background:transparent;border-left-color:var(--line)}
.dy.today{box-shadow:inset 0 0 0 2px var(--train)}
.dy .dt{text-align:center;line-height:1}
.dy .dt span{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.dy .dt b{font-weight:900;font-size:30px}
.dy.today .dt b{color:var(--train)}
.dy .dk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--sub)}
.dy .dk svg{width:14px;height:14px}
.dy .dk em{font-style:normal;background:var(--ground);color:var(--ink);padding:1px 6px}
.dy.hard .dk em:first-of-type,.dy.run .dk em:first-of-type{background:var(--train);color:#fff}
.dy h4{margin:3px 0 0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05}
.dy.off h4{color:var(--faint)}
.dy p{margin:4px 0 0;font-size:13.5px;color:var(--sub)}
.dy p.mv{color:var(--train);font-weight:700}
.dy .ev{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin-top:5px}
.dy .ev svg{width:13px;height:13px;flex:none}
.dy .ga{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--body);font-weight:700;margin-top:5px}
.dy .ga svg{width:14px;height:14px}
.ck{width:36px;height:36px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;margin-top:2px}
.ck svg{width:18px;height:18px}
.ck.on{background:var(--body);border-color:var(--body);color:#fff}

/* Körper */
.blk.body .ruler{margin-top:14px}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:14px}
.blk .wform input[type=text]{background:rgba(255,255,255,.16);border:0;color:#fff;padding:12px;font-size:16px;width:100%;min-width:0;outline:none}
.blk .wform input::placeholder{color:rgba(255,255,255,.75)}
.blk .wform input:focus{background:rgba(255,255,255,.26)}
.wsave{background:#fff;color:var(--body);font-weight:800;padding:0 14px}
.mstones{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mstones div{background:var(--paper);padding:10px 4px;text-align:center;border-top:4px solid var(--line)}
.mstones div.ok{border-top-color:var(--body)}.mstones div.miss{border-top-color:var(--bad)}
.mstones b{display:block;font-weight:900;font-size:21px;line-height:1}
.mstones span{font-size:11.5px;color:var(--sub)}

/* Buttons, Formulare */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--train);color:#fff;padding:12px 18px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--paper);color:var(--ink)}.btn.plain{background:transparent;color:var(--sub);padding:8px}
.btn.block{width:100%;padding:15px;font-size:17px}.btn.small{padding:7px 12px;font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=search],select{width:100%;padding:13px 14px;border:1.5px solid var(--line);background:var(--paper);outline:none;font-size:16px;border-radius:0}
input:focus,select:focus{border-color:var(--train)}
label.f{display:block;font-size:13.5px;color:var(--sub);font-weight:600;margin:12px 2px 6px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:12px}
.chk input{width:20px;height:20px;accent-color:var(--train)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:stretch;justify-content:center;padding:0 0 env(safe-area-inset-bottom);background:var(--paper);border-top:1px solid var(--line)}
.dock button{flex:1;max-width:96px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:700;position:relative}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--ink)}
.dock button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--c,var(--train))}
.dock button[data-t="heute"]{--c:var(--ink)}.dock button[data-t="essen"]{--c:var(--fuel)}.dock button[data-t="training"]{--c:var(--train)}.dock button[data-t="koerper"]{--c:var(--body)}
.dock .plus{flex:none;width:72px;background:var(--ink);color:var(--ground)}
.dock .plus svg{width:26px;height:26px}

/* Sheets */
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--ground);width:100%;max-width:480px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto;border-top:6px solid var(--train)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:fade .2s ease both}.sheet .in{animation:up .3s var(--ease) both}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}
.sheet h1{font-family:var(--display);font-weight:900;font-size:32px;margin:0;line-height:1}
.sheet .row h1{flex:1}
.sheet .list{background:var(--paper);padding:4px 14px;margin-top:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.quick button{padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:800;font-size:17px;min-height:118px}
.quick button svg{width:26px;height:26px}
.quick button span{font-weight:600;font-size:13px;opacity:.85}
.quick [data-q="fav"],.quick [data-q="scan"]{background:var(--fuel);color:#111318}
.quick [data-q="weight"]{background:var(--body);color:#fff}
.quick [data-q="done"]{background:var(--train);color:#fff}
video{width:100%;background:#000;aspect-ratio:4/3;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 72px);background:var(--ink);color:var(--ground);padding:11px 18px;font-size:14.5px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.lnk{color:var(--sub);text-decoration:none;font-size:14px;font-weight:600}
.foot{display:flex;justify-content:center;gap:18px;margin-top:14px}
.card{background:var(--paper);padding:16px}.panel{background:var(--paper);padding:16px}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.login .bibrow{margin-bottom:22px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="dock" id="tabs" hidden>
  <button data-t="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-t="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M17 21V3c-2 1.5-3 4-3 8h3"/></svg>Essen</button>
  <button class="plus" id="plus" aria-label="Schnell eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

const iso = (d) => d.toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });

// ---------- Daten ----------

async function q(p) { const { data, error } = await p; if (error) { console.error(error); toast("Fehler: " + error.message); throw error; } return data; }

  ]);

}
async function loadFoods(since) {
  S.foods = await q(sb.from("foods").select("*").gte("day", since).order("created_at"));
}

const planOn = (d) => S.plan.find((p) => p.date === d);
const foodsOn = (d) => S.foods.filter((f) => f.day === d);
const eventsOn = (d) => S.events.filter((e) => {
  if (e.all_day) { const s = e.starts_at.slice(0, 10), en = e.ends_at.slice(0, 10); return s <= d && (en > d || (en <= s && s === d)); }
  return iso(new Date(e.starts_at)) === d;
});
const actsOn = (d) => S.acts.filter((a) => a.date === d);
const RUN_TYPES = ["Laufen", "Running", "Trail Running", "Treadmill Running", "Laufband"];

function weightAvg(endIso, days = 7) {
  const from = addDays(endIso, -days + 1);
  const v = S.weights.filter((w) => w.kg && w.date >= from && w.date <= endIso).map((w) => +w.kg);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function latestWeight() { const w = [...S.weights].reverse().find((x) => x.kg); return w ? +w.kg : null; }
function latestWaist() { const w = [...S.weights].reverse().find((x) => x.waist_cm); return w ? +w.waist_cm : null; }
function nextMilestone() { const t = today(); return MILESTONES.find(([d]) => d >= t) || MILESTONES.at(-1); }

function ampel() {
  if (S.coach && S.coach.date >= addDays(today(), -1) && S.coach.ampel) return { c: S.coach.ampel, why: S.coach.headline || "" };
  const rows = S.daily.filter((r) => r.hrv_night != null || r.rhr != null);
  const last = rows.at(-1); if (!last) return { c: "grau", why: "Noch keine Garmin-Daten" };
  const prev = rows.at(-2) || {};
  const below = (r) => r.hrv_night != null && r.hrv_base_low != null && r.hrv_night < r.hrv_base_low;
  let c = "gruen", why = [];
  if (below(last)) { c = "gelb"; why.push(`HRV ${last.hrv_night} unter Band ${last.hrv_base_low}–${last.hrv_base_high}`); }
  else if (last.hrv_night != null) why.push(`HRV ${last.hrv_night} im Band`);
  if (last.rhr >= 59) { c = c === "gruen" ? "gelb" : c; why.push(`Ruhepuls ${last.rhr}`); }
  if (last.sleep_h != null && last.sleep_h < 6) { c = c === "gruen" ? "gelb" : c; why.push(`nur ${fmt(last.sleep_h, 1)} h Schlaf`); }
  if ((below(last) && below(prev)) || last.rhr >= 65) c = "rot";
  return { c, why: why.join(" · ") };
}
const AMPEL_TXT = { gruen: "Grün – Plan wie geplant", gelb: "Gelb – heute locker statt hart", rot: "Rot – Pause oder Spaziergang", grau: "Noch keine Daten" };

function streakPlan() {
  let n = 0;
  for (let d = addDays(today(), -1); d >= "2026-11-06"; d = addDays(d, -1)) {
    const p = planOn(d); if (!p || ["rest", "free"].includes(p.kind)) continue;
    if (p.done) n++; else break;
  }
  const t = planOn(today()); if (t && t.done && !["rest", "free"].includes(t.kind)) n++;
  return n;
}
function streakLogging() {
  let n = 0;
  for (let d = addDays(today(), foodsOn(today()).length ? 0 : -1); n < 60; d = addDays(d, -1)) { if (foodsOn(d).length) n++; else break; }
  return n;
}
function beerFreeDays() {
  const days = S.foods.map((f) => f.day).sort();
  if (!days.length) return null;
  const beers = S.foods.filter((f) => f.is_beer).map((f) => f.day).sort();
  return beers.length ? daysBetween(beers.at(-1), today()) : daysBetween(days[0], today()) + 1;
}

// ---------- Rendering ----------
let firstPaint = true;

function weekDots(ws, onColor) {
  return `<div class="wk ${onColor ? "on-color" : ""}">${[...Array(7)].map((_, i) => {
    const d = addDays(ws, i), p = planOn(d), k = kindOf(p ? p.kind : "free");
    const st = p && isTrain(p) ? (p.done ? "done" : d < today() ? "miss" : k.cls) : "off";
    return `<div class="wd ${d === today() ? "today" : ""}"><span>${wdMini(d).slice(0, 2)}</span><i class="${st}">${p && p.done && isTrain(p) ? ICO.check : isTrain(p) ? ICO[k.ico] : ""}</i></div>`; }).join("")}</div>`;
}

function segs(eaten, target) {
  const per = target / 10;
  return `<div class="segs ${eaten > target ? "over" : ""}" aria-label="${fmt(eaten)} von ${fmt(target)} kcal">${[...Array(10)].map((_, i) => {
    const lo = i * per, hi = lo + per;
    if (eaten >= hi) return `<i class="f"></i>`;
    if (eaten > lo) return `<i class="p" style="--pp:${Math.round((eaten - lo) / per * 100)}%"></i>`;
    return `<i></i>`; }).join("")}</div>`;
}

function ruler(cur, compact) {
  const W = 340, H = compact ? 46 : 70, x0 = 10, x1 = W - 10, hi = START.kg, lo = GOAL_KG;
  const x = (v) => x0 + (hi - v) / (hi - lo) * (x1 - x0);
  const base = compact ? 34 : 50;
  let ticks = "";
  for (let v = hi * 2; v >= lo * 2; v--) { const kg = v / 2, major = kg % 1 === 0;
    ticks += `<line x1="${x(kg)}" x2="${x(kg)}" y1="${base - (major ? 16 : 9)}" y2="${base}" stroke="currentColor" stroke-opacity="${major ? .9 : .5}" stroke-width="${major ? 1.6 : 1}"/>`;
    if (major && !compact) ticks += `<text x="${x(kg)}" y="${H - 2}" text-anchor="middle">${kg}</text>`; }
  if (compact) ticks += `<text x="${x0}" y="${H - 1}" text-anchor="start">${hi}</text><text x="${x1}" y="${H - 1}" text-anchor="end">${lo}</text>`;
  const ms = MILESTONES.filter(([, kg]) => kg >= lo).map(([d, kg]) => `<rect x="${x(kg) - 2}" y="${base - 22}" width="4" height="6" fill="var(--signal)"><title>${dShort(d)}: ${fmt(kg, 1)} kg</title></rect>`).join("");
  const c = Math.max(lo, Math.min(hi, cur));
  return `<svg class="ruler" viewBox="0 0 ${W} ${H}" role="img" aria-label="${fmt(cur, 1)} kg auf dem Weg von ${hi} zu ${lo} kg">

    <path d="M${x(c) - 8} 0 h16 l-8 11 z" fill="currentColor"/><line x1="${x(c)}" x2="${x(c)}" y1="10" y2="${base + 2}" stroke="currentColor" stroke-width="3"/></svg>`;
}

    ${weekDots(mondayOf(today()), true)}</section>`;
}

  const evs = eventsOn(t).filter((e) => !e.all_day);

function spark(rows, key, band) {
  const W = 320, H = 56, pts = rows.map((r, i) => [i, r[key]]).filter(([, v]) => v != null);
  if (pts.length < 2) return `<div class="xs">Zu wenig Daten</div>`;
  const vs = pts.map(([, v]) => v).concat(band ? rows.flatMap((r) => [r[band[0]], r[band[1]]]).filter((v) => v != null) : []);
  const lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1, n = rows.length - 1 || 1;
  const x = (i) => 4 + i / n * (W - 8), y = (v) => 5 + (hi - v) / (hi - lo) * (H - 10);
  let b = "";
  if (band) { const top = rows.map((r, i) => r[band[1]] != null ? `${x(i)},${y(r[band[1]])}` : null).filter(Boolean), bot = rows.map((r, i) => r[band[0]] != null ? `${x(i)},${y(r[band[0]])}` : null).filter(Boolean).reverse();
    if (top.length > 1) b = `<polygon points="${top.concat(bot).join(" ")}" fill="currentColor" opacity=".16"/>`; }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${b}<polyline points="${pts.map(([i, v]) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <rect x="${x(pts.at(-1)[0]) - 4}" y="${y(pts.at(-1)[1]) - 4}" width="8" height="8" fill="currentColor"/></svg>`;
}

function weightChart() {
  const W = 340, H = 170, pad = { l: 30, r: 8, t: 10, b: 22 };
  const pts = S.weights.filter((w) => w.kg).map((w) => ({ d: w.date, v: +w.kg }));
  const path = [[START.date, START.kg], ...MILESTONES];
  const end = pts.length && pts.at(-1).d > addDays(today(), 42) ? pts.at(-1).d : addDays(today(), 42);
  const goalAt = (d) => { for (let i = 1; i < path.length; i++) { const [d0, v0] = path[i - 1], [d1, v1] = path[i]; if (d <= d1) return v0 + (v1 - v0) * daysBetween(d0, d) / daysBetween(d0, d1); } return path.at(-1)[1]; };
  const gp = path.filter(([d]) => d < end).concat([[end, goalAt(end)]]);
  const x0 = pts.length && pts[0].d < START.date ? pts[0].d : START.date, span = Math.max(30, daysBetween(x0, end));
  const vals = [...pts.map((p) => p.v), ...gp.map(([, v]) => v), START.kg];
  const lo = Math.floor(Math.min(...vals) - 0.5), hi = Math.ceil(Math.max(...vals) + 0.5);
  const x = (d) => pad.l + daysBetween(x0, d) / span * (W - pad.l - pad.r);
  const y = (v) => pad.t + (hi - v) / (hi - lo) * (H - pad.t - pad.b);
  const ticks = []; for (let v = hi; v >= lo; v -= Math.max(1, Math.round((hi - lo) / 4))) ticks.push(v);
  const avgLine = pts.map((p) => [p.d, weightAvg(p.d)]).filter(([, v]) => v);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gewichtsverlauf">
    ${ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--sub)" font-family="var(--display)" font-weight="700">${v}</text>`).join("")}
    <polyline points="${gp.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--faint)" stroke-dasharray="4 5" stroke-width="1.5"/>
    ${avgLine.length > 1 ? `<polyline points="${avgLine.map(([d, v]) => `${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--body)" stroke-width="3" stroke-linejoin="round"/>` : ""}
    ${pts.map((p) => `<rect x="${x(p.d) - 3}" y="${y(p.v) - 3}" width="6" height="6" fill="var(--body)" opacity=".45"/>`).join("")}
    <text x="${pad.l}" y="${H - 5}" font-size="12" fill="var(--sub)">${dShort(x0)}</text><text x="${W - pad.r}" y="${H - 5}" text-anchor="end" font-size="12" fill="var(--sub)">${dShort(end)}</text>
  </svg>`;
}

function countUp() {
  const el = $("#bibno"); if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const to = +el.dataset.to, from = Math.min(to + 60, 400), t0 = performance.now(), dur = 900;
  const step = (now) => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from - (from - to) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ---------- Interaktion ----------
function bind() {
  $$("[data-go]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); go(el.dataset.go); });
  $$("[data-done]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); toggleDone(el.dataset.done); });
  const r = $("#reload"); if (r) r.onclick = async () => { await loadAll(); render(); toast("Aktualisiert"); };
  const lo = $("#logout"); if (lo) lo.onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $$("[data-day]").forEach((el) => el.onclick = () => { const n = addDays(S.essenDay, +el.dataset.day); if (n <= today()) { S.essenDay = n; render(); } });
  $$("[data-week]").forEach((el) => el.onclick = () => { S.weekStart = addDays(S.weekStart, 7 * el.dataset.week); render(); });
  $$("[data-fav]").forEach((el) => el.onclick = () => addFav(el.dataset.fav));
  $$("[data-delfood]").forEach((el) => el.onclick = () => delFood(el.dataset.delfood));
  $$("[data-delw]").forEach((el) => el.onclick = () => delWeight(el.dataset.delw));
  const m = $("#manual"); if (m) m.onclick = () => foodSheet({});
  const sc = $("#scan"); if (sc) sc.onclick = scanSheet;
  const se = $("#search"); if (se) se.onclick = searchSheet;
  const ef = $("#editfavs"); if (ef) ef.onclick = favSheet;
  const ws = $("#wsave"); if (ws) ws.onclick = saveWeight;
  const cc = $("#copycal"); if (cc) cc.onclick = async () => { try { await navigator.clipboard.writeText(CFG.planCalendarUrl); toast("Adresse kopiert"); } catch { $("#calurl").select(); toast("Adresse markiert, jetzt kopieren"); } };
}
function go(t) { S.tab = t; if (t === "essen") S.essenDay = today(); render(); }

async function toggleDone(d) {
  const p = planOn(d); if (!p) return;
  const done = !p.done;
  await q(sb.from("plan").update({ done, done_at: done ? new Date().toISOString() : null }).eq("date", d));
  p.done = done; S._stamp = done ? d : null; render(); if (done) toast(["Stark gemacht", "Erledigt", "Läuft bei dir", "Abgehakt"][Math.floor(Math.random() * 4)]);
}

async function insertFood(f) {
  const row = await q(sb.from("foods").insert({ day: S.essenDay, ...f }).select().single());
  S.foods.push(row); render(); toast(`+${row.kcal} kcal`);
}
async function addFav(id) {
  const f = S.favs.find((x) => x.id === id); if (!f) return;
  await insertFood({ name: f.name, kcal: f.kcal, protein: f.protein, meal: f.meal || guessMeal(), is_beer: f.is_beer });
}
async function delFood(id) { await q(sb.from("foods").delete().eq("id", id)); S.foods = S.foods.filter((f) => f.id !== id); render(); }
function guessMeal() { const h = new Date().getHours(); return h < 11 ? "Frühstück" : h < 15 ? "Mittag" : h < 18 ? "Snack" : "Abend"; }

async function saveWeight() {
  const kg = parseFloat(($("#wkg").value || "").replace(",", ".")), waist = parseFloat(($("#wwaist").value || "").replace(",", "."));
  if (!kg && !waist) return toast("Gewicht oder Bauchumfang eintragen");
  if (kg && (kg < 50 || kg > 200)) return toast("Das Gewicht wirkt unrealistisch");
  const row = { date: today(), kg: kg || null, waist_cm: waist || null, source: "app", updated_at: new Date().toISOString() };
  await q(sb.from("weights").upsert(row, { onConflict: "date" }));
  S.weights = S.weights.filter((w) => w.date !== row.date).concat(row).sort((a, b) => a.date < b.date ? -1 : 1);
  render(); toast("Gewicht gespeichert");
}
async function delWeight(d) { await q(sb.from("weights").delete().eq("date", d)); S.weights = S.weights.filter((w) => w.date !== d); render(); }

// ---------- Sheets ----------
function sheet(html, onOpen) {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div class="in">${html}</div>`;
  el.onclick = (e) => { if (e.target === el) close(); };
  const close = () => { el.remove(); if (el._cleanup) el._cleanup(); };
  el.close = close; document.body.append(el);
  $$("[data-close]", el).forEach((b) => b.onclick = close);
  if (onOpen) onOpen(el);
  return el;
}

function foodSheet(pre) {
  const per100 = pre.per100;
  sheet(`<div class="row"><h1 class="grow">${per100 ? "Produkt" : "Eigenes Essen"}</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <label class="f">Name</label><input type="text" id="fn" value="${esc(pre.name || "")}">
    ${per100 ? `<div class="small muted" style="margin-top:6px">${fmt(per100.kcal)} kcal und ${fmt(per100.protein, 1)} g Protein pro 100 g</div>
      <label class="f">Menge (g)</label><input type="text" inputmode="decimal" id="fg" value="${pre.grams || 100}">` : ""}
    <div class="row" style="gap:8px"><div class="grow"><label class="f">kcal</label><input type="text" inputmode="numeric" id="fk" value="${pre.kcal ?? ""}"></div>
      <div class="grow"><label class="f">Protein (g)</label><input type="text" inputmode="decimal" id="fp" value="${pre.protein ?? ""}"></div></div>
    <label class="f">Mahlzeit</label><select id="fm">${MEALS.map((m) => `<option ${m === guessMeal() ? "selected" : ""}>${m}</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="fbeer"> Ist Bier/Alkohol</label>
    <label class="chk"><input type="checkbox" id="ffav"> Als Favorit speichern</label>
    <button class="btn block" id="fsave" style="margin-top:16px">Eintragen</button>`, (el) => {
    const recalc = () => { if (!per100) return; const g = parseFloat($("#fg", el).value.replace(",", ".")) || 0;
      $("#fk", el).value = Math.round(per100.kcal * g / 100); $("#fp", el).value = (per100.protein * g / 100).toFixed(1); };
    if (per100) { $("#fg", el).oninput = recalc; recalc(); }
    $("#fsave", el).onclick = async () => {
      const name = $("#fn", el).value.trim(), kcal = parseInt($("#fk", el).value), protein = parseFloat(($("#fp", el).value || "0").replace(",", ".")) || 0;
      if (!name || !(kcal >= 0)) return toast("Name und kcal eintragen");
      const meal = $("#fm", el).value, is_beer = $("#fbeer", el).checked;
      const grams = per100 ? parseFloat($("#fg", el).value.replace(",", ".")) || null : null;
      if ($("#ffav", el).checked) { const fav = await q(sb.from("favorites").insert({ name: grams ? `${name} ${Math.round(grams)} g` : name, kcal, protein, meal, is_beer }).select().single()); S.favs.push(fav); }
      el.close(); await insertFood({ name, kcal, protein, meal, is_beer, grams, barcode: pre.barcode || null });
    };
  });
}

async function offProduct(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity`);
  const j = await r.json(); if (j.status !== 1 || !j.product) return null;
  return offMap(j.product, code);
}
function offMap(p, code) {
  const n = p.nutriments || {};
  const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"] / 4.184 : null);
  if (kcal == null) return null;
  const name = [p.product_name_de || p.product_name, p.brands ? `(${String(p.brands).split(",")[0]})` : ""].filter(Boolean).join(" ");
  return { name: name || "Produkt", barcode: code || p.code, per100: { kcal: +kcal, protein: +(n.proteins_100g || 0) }, grams: +(p.serving_quantity) || 100 };
}

function scanSheet() {
  sheet(`<div class="row"><h1 class="grow">Barcode scannen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <video id="cam" playsinline muted></video><div class="small muted" id="scanmsg" style="margin:8px 0">Kamera wird gestartet …</div>
    <label class="f">Oder Nummer eintippen</label><div class="row"><input type="text" inputmode="numeric" id="code"><button class="btn" id="codego">OK</button></div>`, async (el) => {
    let stop = () => {}, done = false;
    el._cleanup = () => stop();
    const found = async (code) => {
      if (done) return; done = true; stop(); $("#scanmsg", el).textContent = `Gefunden: ${code} – suche Produkt …`;
      try { const p = await offProduct(code); el.close(); if (p) foodSheet(p); else { toast("Produkt nicht gefunden"); foodSheet({ barcode: code }); } }
      catch { el.close(); toast("Keine Verbindung zur Produktdatenbank"); foodSheet({ barcode: code }); }
    };
    $("#codego", el).onclick = () => { const c = $("#code", el).value.trim(); if (c) found(c); };
    try {
      if ("BarcodeDetector" in window) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const v = $("#cam", el); v.srcObject = stream; await v.play();
        const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
        let live = true; stop = () => { live = false; stream.getTracks().forEach((t) => t.stop()); };
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const loop = async () => { if (!live) return; try { const c = await det.detect(v); if (c[0]) return found(c[0].rawValue); } catch {} requestAnimationFrame(loop); };
        loop();
      } else {
        if (!window.ZXingBrowser) await loadScript("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js");
        const reader = new ZXingBrowser.BrowserMultiFormatReader();
        $("#scanmsg", el).textContent = "Barcode ins Bild halten";
        const ctrl = await reader.decodeFromVideoDevice(undefined, $("#cam", el), (res) => { if (res) found(res.getText()); });
        stop = () => { try { ctrl.stop(); } catch {} };
      }
    } catch (e) { $("#scanmsg", el).textContent = "Kamera nicht verfügbar – Nummer eintippen geht immer."; }
  });
}

function searchSheet() {
  sheet(`<div class="row"><h1 class="grow">Produkt suchen</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="row"><input type="search" id="sq" placeholder="z. B. Skyr, Laugenbrezel"><button class="btn" id="sgo">Los</button></div>
    <div class="list" id="sres" style="margin-top:12px"></div>`, (el) => {
    const run = async () => {
      const term = $("#sq", el).value.trim(); if (!term) return;
      $("#sres", el).innerHTML = `<div class="small muted">Suche …</div>`;
      try {
        const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=20&cc=de&lc=de&fields=code,product_name,product_name_de,brands,nutriments,serving_quantity`);
        const j = await r.json(); const items = (j.products || []).map((p) => offMap(p, p.code)).filter(Boolean);
        el._items = items;
        $("#sres", el).innerHTML = items.length ? items.map((p, i) => `<div class="it" data-i="${i}"><span class="grow">${esc(p.name)}</span><span class="small muted num">${fmt(p.per100.kcal)} kcal/100 g</span></div>`).join("") : `<div class="small muted">Nichts gefunden. Probier's mit „Eigenes“.</div>`;
        $$("[data-i]", el).forEach((it) => it.onclick = () => { const p = el._items[+it.dataset.i]; el.close(); foodSheet(p); });
      } catch { $("#sres", el).innerHTML = `<div class="small muted">Keine Verbindung zur Produktdatenbank.</div>`; }
    };
    $("#sgo", el).onclick = run; $("#sq", el).onkeydown = (e) => { if (e.key === "Enter") run(); }; $("#sq", el).focus();
  });
}

function favSheet() {
  sheet(`<div class="row"><h1 class="grow">Favoriten</h1><button class="ibtn" data-close aria-label="Schließen">${ICO.x}</button></div>
    <div class="list">${S.favs.map((f) => `<div class="it"><span class="grow">${esc(f.name)}</span><span class="small muted num">${f.kcal} kcal, ${fmt(f.protein)} g Protein</span><button class="btn plain small" data-delfav="${f.id}">Löschen</button></div>`).join("")}</div>
    <div class="small muted" style="margin-top:10px">Neue Favoriten legst du über „Eigenes“ oder einen Barcode mit dem Haken „Als Favorit speichern“ an.</div>`, (el) => {
    $$("[data-delfav]", el).forEach((b) => b.onclick = async () => { await q(sb.from("favorites").delete().eq("id", b.dataset.delfav)); S.favs = S.favs.filter((f) => f.id !== b.dataset.delfav); b.closest(".it").remove(); render(); });
  });
}

// ---------- Login & Start ----------
function vLogin(msg = "") {
  $("#tabs").hidden = true;
  $("#app").innerHTML = `<div class="login"><div class="bibrow enter"><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i>
      <div class="bn num">21</div><div class="bt"><b>Dennis</b><span>${RACE.name}, ${monthDay(RACE.date)} 2027</span><em>Startnummer abholen</em></div></div>
    <label class="f" for="le">E-Mail</label><input type="email" id="le" autocomplete="username">
    <label class="f" for="lp">Passwort</label><input type="password" id="lp" autocomplete="current-password">
    <button class="btn block" id="lgo" style="margin-top:18px">Anmelden</button>${msg ? `<p class="s" style="color:var(--bad);margin-top:12px">${esc(msg)}</p>` : ""}</div>`;
  $("#lgo").onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
    if (error) return vLogin("Anmeldung fehlgeschlagen: " + error.message);
    start();
  };
}
async function start() {
  $("#app").innerHTML = `<div class="sub" style="text-align:center;margin-top:40vh">Lade deine Daten …</div>`;
  try { await loadAll(); } catch (e) { $("#app").innerHTML = `<div class="panel">Daten konnten nicht geladen werden: ${esc(e.message || e)}<br><button class="btn" onclick="location.reload()" style="margin-top:12px">Neu laden</button></div>`; return; }
  $("#tabs").hidden = false;
  $$(".dock [data-t]").forEach((b) => b.onclick = () => go(b.dataset.t));
  $("#plus").onclick = quickSheet;
  render(); countUp();
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && sb && !$("#tabs").hidden && !document.querySelector(".sheet")) {
    try { await loadAll(); render(); } catch {}
  }
});
(async () => {
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"); }
  catch { $("#app").innerHTML = `<div class="card">Keine Verbindung. Bitte später nochmal öffnen.</div>`; return; }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(); else vLogin();
})();
</script>
